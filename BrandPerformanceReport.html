function computeMonthlyAvg(){
  const raw={};
  CONSULTANT_RECORDS.forEach(rec=>{
    const key=`${rec.brandKey}|${rec.store}|${rec.consultant}|${rec.date.slice(0,7)}`;
    if(!raw[key]) raw[key]={bk:rec.brandKey,store:rec.store,cs:rec.consultant,mo:rec.date.slice(0,7),sum:0,n:0};
    // 分母=接待人數（含未成交），分子=成交 total_amt 加總，與 detail card 一致
    rec.clients.forEach(c=>{if(c.type==='新客'){raw[key].n++;if(c.total_amt>0)raw[key].sum+=c.total_amt;}});
  });
  const res={wo:{},ki:{}};
  Object.values(raw).forEach(({bk,store,cs,mo,sum,n})=>{
    if(!n||!res[bk]) return;
    if(!res[bk][store]) res[bk][store]={};
    if(!res[bk][store][cs]) res[bk][store][cs]={};
    res[bk][store][cs][mo]=Math.round(sum/n);
  });
  return res;
}

function drawTrendChart(canvasId,legId,storeData,bk){
  const canvas=document.getElementById(canvasId);
  const legEl=document.getElementById(legId);
  if(!canvas||!legEl) return null;
  const WO_C=['#185fa5','#378add','#0f6e56','#1d9e75','#4a3aa7','#85b7eb'];
  const KI_C=['#c04070','#d4537e','#993556','#ed93b1'];
  const clrs=bk==='wo'?WO_C:KI_C;
  const BD=[[],[5,5],[3,3],[8,3],[5,3,1,3]];
  const monthSet=new Set();
  Object.values(storeData).forEach(m=>Object.keys(m).forEach(k=>monthSet.add(k)));
  const months=[...monthSet].sort();
  const labels=months.map(m=>`${parseInt(m.split('-')[1])}月`);
  const consultants=Object.keys(storeData);
  legEl.innerHTML=consultants.map((cs,i)=>{
    const nick=NICKNAMES[cs]?` (${NICKNAMES[cs]})`:'';
    return `<span class="cs-tp-li"><span class="cs-tp-ld" style="background:${clrs[i%clrs.length]}"></span>${cs}${nick}</span>`;
  }).join('');
  const datasets=consultants.map((cs,i)=>({
    label:cs+(NICKNAMES[cs]?` (${NICKNAMES[cs]})`:''),
    data:months.map(mo=>storeData[cs][mo]??null),
    backgroundColor:clrs[i%clrs.length]+'cc',
    borderColor:clrs[i%clrs.length],
    borderWidth:1,
    borderRadius:3,
    borderSkipped:false,
  }));
  return new Chart(canvas,{
    type:'bar',
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{label:x=>x.parsed.y!=null?`${x.dataset.label}: NT$${Math.round(x.parsed.y).toLocaleString()}`:`${x.dataset.label}: —`},
          backgroundColor:'#fff',borderColor:'#e8e7e1',borderWidth:0.5,
          titleColor:'#1a1a18',bodyColor:'#898781',padding:10,
        }
      },
      scales:{
        x:{grid:{display:false},ticks:{color:'#898781',font:{size:11}},border:{color:'#e8e7e1'}},
        y:{grid:{color:'#e8e7e1'},ticks:{color:'#898781',font:{size:10},callback:v=>'$'+Math.round(v/1000)+'K'},border:{color:'#e8e7e1'}}
      }
    }
  });
}

function computeStoreMonthlyAvg(){
  const raw={};
  CONSULTANT_RECORDS.forEach(rec=>{
    const key=`${rec.brandKey}|${rec.store}|${rec.date.slice(0,7)}`;
    if(!raw[key]) raw[key]={bk:rec.brandKey,store:rec.store,mo:rec.date.slice(0,7),sum:0,n:0};
    rec.clients.forEach(c=>{
      if(c.type==='新客'){raw[key].n++;if(c.total_amt>0)raw[key].sum+=c.total_amt;}
    });
  });
  const res={wo:{},ki:{}};
  Object.values(raw).forEach(({bk,store,mo,sum,n})=>{
    if(!n||!res[bk]) return;
    if(!res[bk][store]) res[bk][store]={};
    res[bk][store][mo]=Math.round(sum/n);
  });
  return res;
}

function getStoreData(mo,bk,store){
  if(store==='全部') return computeStoreMonthlyAvg()[bk]||null;
  return mo[bk][store]||null;
}

function initTrendPanel(){
  const mo=computeMonthlyAvg();
  const woStores=['全部',...Object.keys(mo.wo)];
  const kiStores=['全部',...Object.keys(mo.ki)];
  if(!_woTrendStore||(_woTrendStore!=='全部'&&!mo.wo[_woTrendStore])) _woTrendStore='全部';
  if(!_kiTrendStore||(_kiTrendStore!=='全部'&&!mo.ki[_kiTrendStore])) _kiTrendStore='全部';
  ['wo','ki'].forEach(bk=>{
    const stores=bk==='wo'?woStores:kiStores;
    const cur=bk==='wo'?_woTrendStore:_kiTrendStore;
    const tabsEl=document.getElementById(`cs-trend-${bk}-tabs`);
    if(tabsEl) tabsEl.innerHTML=stores.map(s=>
      `<button class="cs-tp-tab${s===cur?' '+bk+'-on':''}" onclick="_${bk}TrendStore='${s}';switchTrendStore('${bk}')">${s}</button>`
    ).join('');
  });
  const woData=getStoreData(mo,'wo',_woTrendStore);
  const kiData=getStoreData(mo,'ki',_kiTrendStore);
  if(woData) _woTrendChart=drawTrendChart('cs-trend-wo','cs-trend-wo-leg',woData,'wo');
  if(kiData) _kiTrendChart=drawTrendChart('cs-trend-ki','cs-trend-ki-leg',kiData,'ki');
}

function switchTrendStore(bk){
  const mo=computeMonthlyAvg();
  const store=bk==='wo'?_woTrendStore:_kiTrendStore;
  const data=getStoreData(mo,bk,store);
  if(bk==='wo'){
    if(_woTrendChart){_woTrendChart.destroy();_woTrendChart=null;}
    if(data) _woTrendChart=drawTrendChart('cs-trend-wo','cs-trend-wo-leg',data,'wo');
  } else {
    if(_kiTrendChart){_kiTrendChart.destroy();_kiTrendChart=null;}
    if(data) _kiTrendChart=drawTrendChart('cs-trend-ki','cs-trend-ki-leg',data,'ki');
  }
  document.querySelectorAll(`#cs-trend-${bk}-tabs .cs-tp-tab`).forEach(b=>{
    b.className='cs-tp-tab'+(b.textContent===store?` ${bk}-on`:'');
  });
}

function showStoreDetail(storeKey){
  // 依照目前選擇的日期區間 filter（ki / wo 統一動態生成）
  const now=new Date(), fmtD=d=>d.toISOString().slice(0,10);
  const todayS=fmtD(now), yest=new Date(now);yest.setDate(yest.getDate()-1);const yestS=fmtD(yest);
  const s=_csStart||(_csMonth?_csMonth+'-01':todayS), e=_csEnd||todayS;
  const dateOk=date=>{
    if(_csMode==='today')     return date===todayS;
    if(_csMode==='yesterday') return date===yestS;
    if(_csMode==='month')     return date.startsWith(_csMonth);
    if(_csMode==='custom')    return date>=s&&date<=e;
    return true;
  };
  const allRecs=(typeof CONSULTANT_RECORDS!=='undefined')?CONSULTANT_RECORDS:[];
  const recs=allRecs.filter(r=>r.storeKey===storeKey&&dateOk(r.date));
  const firstRec=allRecs.find(r=>r.storeKey===storeKey)||{};
  const storeName=firstRec.store||storeKey;
  const brandKey=firstRec.brandKey||'wo';
  const byDate={};
  recs.forEach(rec=>{
    rec.clients.filter(c=>c.type==='新客'||c.type==='其他').forEach(c=>{
      if(!byDate[rec.date])byDate[rec.date]=[];
      byDate[rec.date].push({consultant:rec.consultant,type:c.type,sold:c.total_amt>c.trial_amt,amt:c.total_amt,name:c.name||''});
    });
  });
  const sortedDates=Object.keys(byDate).sort();
  if(!sortedDates.length){return;}
  let totalNew=0,totalSold=0,totalRev=0;
  const wds=['日','一','二','三','四','五','六'];
  const daysHtml=sortedDates.map(date=>{
    const cls=byDate[date];
    const daySold=cls.filter(c=>c.sold).length;
    const dayRev=cls.filter(c=>c.sold).reduce((s,c)=>s+c.amt,0);
    totalNew+=cls.length;totalSold+=daySold;totalRev+=dayRev;
    const d=new Date(date),m=d.getMonth()+1,dy=d.getDate(),wd=wds[d.getDay()];
    const hasNames=cls.some(c=>c.name);
    const rows=cls.map((c,i)=>`<tr><td>${i+1}</td>${hasNames?`<td>${c.name||'—'}</td>`:''}<td><span class="ki-tag t-${c.consultant}">${c.consultant}</span></td><td class="${c.sold?'ki-sold':'ki-no'}">${c.sold?'$'+c.amt.toLocaleString():'—'}</td><td class="${c.sold?'ki-sold':'ki-no'}">${c.type==='其他'?'分享客':c.sold?'✓ 成交':'✗ 未成交'}</td></tr>`).join('');
    return `<div class="ki-day"><div class="ki-day-hd"><span>${m}月${dy}日（${wd}）</span><span class="ki-dmeta">新客 ${cls.length} 人｜成交 ${daySold} 人</span><span>${dayRev>0?'$'+dayRev.toLocaleString():'—'}</span></div><table class="ki-tbl"><thead><tr><th>#</th>${hasNames?'<th>顧客姓名</th>':''}<th>諮詢師</th><th>業績</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  // 標題日期範圍：依 filter mode 決定
  let rangeLabel;
  if(_csMode==='today') rangeLabel=todayS.slice(5).replace('-','/');
  else if(_csMode==='yesterday') rangeLabel=yestS.slice(5).replace('-','/');
  else if(_csMode==='month') rangeLabel=`${parseInt(_csMonth.slice(5))}月`;
  else{ const sd=new Date(s),ed=new Date(e); rangeLabel=`${sd.getMonth()+1}/${sd.getDate()}–${ed.getMonth()+1}/${ed.getDate()}`; }
  const title=`${storeName} ${rangeLabel} 新客明細`;
  const rate=totalNew>0?Math.round(totalSold/totalNew*100):0;
  const overlay=document.getElementById('kiModalOverlay');
  if(brandKey==='wo') overlay.classList.add('wo-mode'); else overlay.classList.remove('wo-mode');
  document.getElementById('kiModalTitle').textContent=title;

  document.getElementById('kiModalDays').innerHTML=daysHtml;
  overlay.classList.add('open');
}
function closeKiModal(){const o=document.getElementById('kiModalOverlay');o.classList.remove('open','wo-mode');}
function showRetDetail(storeKey){
  const now=new Date(), fmtD=d=>d.toISOString().slice(0,10);
  const todayS=fmtD(now), yest=new Date(now);yest.setDate(yest.getDate()-1);const yestS=fmtD(yest);
  const s=_csStart||(_csMonth?_csMonth+'-01':todayS), e=_csEnd||todayS;
  const dateOk=date=>{
    if(_csMode==='today')     return date===todayS;
    if(_csMode==='yesterday') return date===yestS;
    if(_csMode==='month')     return date.startsWith(_csMonth);
    if(_csMode==='custom')    return date>=s&&date<=e;
    return true;
  };
  const allRecs=(typeof CONSULTANT_RECORDS!=='undefined')?CONSULTANT_RECORDS:[];
  const recs=allRecs.filter(r=>r.storeKey===storeKey&&dateOk(r.date));
  const firstRec=allRecs.find(r=>r.storeKey===storeKey)||{};
  const storeName=firstRec.store||storeKey;
  const brandKey=firstRec.brandKey||'wo';
  const byDate={};
  recs.forEach(rec=>{
    rec.clients.filter(c=>c.type==='舊客體驗').forEach(c=>{
      if(!byDate[rec.date])byDate[rec.date]=[];
      const sold=c.total_amt>c.trial_amt;
      byDate[rec.date].push({consultant:rec.consultant,name:c.name||'',trial:c.trial_amt,total:sold?c.total_amt:0,sold});
    });
  });
  const sortedDates=Object.keys(byDate).sort();
  if(!sortedDates.length){alert('此區間無舊客新體驗資料');return;}
  let totalTrial=0,totalSold=0,totalNew=0,totalRev=0;
  const wds=['日','一','二','三','四','五','六'];
  const daysHtml=sortedDates.map(date=>{
    const cls=byDate[date];
    const daySold=cls.filter(c=>c.sold).length;
    const dayRev=cls.reduce((s,c)=>s+c.trial+(c.sold?c.total:0),0);
    totalNew+=cls.length;totalSold+=daySold;totalRev+=dayRev;
    const d=new Date(date),m=d.getMonth()+1,dy=d.getDate(),wd=wds[d.getDay()];
    const rows=cls.map((c,i)=>{
      const rowRev=c.trial+(c.sold?c.total:0);
      const trialStr='$'+c.trial.toLocaleString();
      const totalStr=c.sold?'$'+c.total.toLocaleString():'—';
      return `<tr><td>${i+1}</td><td>${c.name||'—'}</td><td><span class="ki-tag t-${c.consultant}">${c.consultant}</span></td><td>${trialStr}</td><td class="${c.sold?'ki-sold':'ki-no'}">${totalStr}</td><td class="${c.sold?'ki-sold':'ki-no'}">${c.sold?'✓ 成交':'✗ 未成交'}</td><td>$${rowRev.toLocaleString()}</td></tr>`;
    }).join('');
    return `<div class="ki-day"><div class="ki-day-hd"><span>${m}月${dy}日（${wd}）</span><span class="ki-dmeta">體驗 ${cls.length} 人｜成交 ${daySold} 人</span><span>${dayRev>0?'$'+dayRev.toLocaleString():'—'}</span></div><table class="ki-tbl"><thead><tr><th>#</th><th>顧客姓名</th><th>諮詢師</th><th>體驗金</th><th>課程金</th><th>狀態</th><th>合計</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  let rangeLabel;
  if(_csMode==='today') rangeLabel=todayS.slice(5).replace('-','/');
  else if(_csMode==='yesterday') rangeLabel=yestS.slice(5).replace('-','/');
  else if(_csMode==='month') rangeLabel=`${parseInt(_csMonth.slice(5))}月`;
  else{ const sd=new Date(s),ed=new Date(e); rangeLabel=`${sd.getMonth()+1}/${sd.getDate()}–${ed.getMonth()+1}/${ed.getDate()}`; }
  const title=`${storeName} ${rangeLabel} 舊客新體驗明細`;
  const rate=totalNew>0?Math.round(totalSold/totalNew*100):0;
  const overlay=document.getElementById('kiModalOverlay');
  if(brandKey==='wo') overlay.classList.add('wo-mode'); else overlay.classList.remove('wo-mode');
  document.getElementById('kiModalTitle').textContent=title;
  document.getElementById('kiModalSum').innerHTML=`<div><span>新體驗：</span><strong>${totalNew} 人</strong></div><div><span>成交：</span><strong>${totalSold} 人（${rate}%）</strong></div><div><span>舊客業績：</span><strong>$${totalRev.toLocaleString()}</strong></div>`;
  document.getElementById('kiModalDays').innerHTML=daysHtml;
  overlay.classList.add('open');
}

<script>

function openSpModal(){
  const today = new Date();
  const moIdx = (typeof _curMoTab !== 'undefined') ? _curMoTab : today.getMonth(); // 0-indexed, sync with outer month tab
  // 顯示用的年月：以 moIdx 為準
  const dispYear = today.getFullYear();
  const dispMo   = moIdx + 1; // 1-based
  // 截至日：選當月→昨天；選歷史月→當月最後一天
  const isCurMo  = (moIdx === today.getMonth());
  const yd       = new Date(today); yd.setDate(today.getDate()-1);
  const dispDay  = isCurMo ? yd.getDate() : new Date(dispYear, moIdx+1, 0).getDate();
  const yr = dispYear, mo = dispMo, day = dispDay;

  // 讀 MO_SNAP_DATA（跟每月業績進度分頁同源，來自 Google Sheet 同步）
  const snap = (typeof MO_SNAP_DATA!=='undefined' && MO_SNAP_DATA[moIdx]) ? MO_SNAP_DATA[moIdx] : {};

  const fmtM  = v=>v>=10000?(v/10000).toFixed(1)+'萬':(v/1000).toFixed(1)+'K';
  const fmtM2 = v=>v>=10000?Math.round(v/10000)+'萬':(v/1000).toFixed(0)+'K';
  const fmtN  = v=>'$'+Math.round(v).toLocaleString('zh-TW');
  const achColor  = a=>a===null?'#aaa':a>=1?'#3B6D11':a>=0.8?'#b07d00':'#A32D2D';
  const achClass  = a=>a===null?'':a>=1?'sp-ach-green':a>=0.8?'sp-ach-amber':'sp-ach-red';
  const achTxt    = a=>a===null?'—':(a*100).toFixed(0)+'%';

  function sd(sk){
    const s=snap[sk]||{}, d=DATA[sk]||{};
    const mtd = s.total_rev||0;
    const tgt = s.target||(d.monthly_tgt?d.monthly_tgt[moIdx]:0)||(d.target_h1?Math.round(d.target_h1/6):0)||0;
    const ach = tgt>0?mtd/tgt:null;
    return {mtd,tgt,ach};
  }

  // LY helper
  const ly = (typeof LY_MONTHLY!=='undefined') ? LY_MONTHLY : {};
  function lyRev(sk){ const a=ly[sk]; return (a&&a[moIdx])?a[moIdx].rev:0; }
  function yoyTxt(cur,prev){
    if(!prev) return {txt:'—',clr:'#aaa'};
    const r=(cur-prev)/prev;
    const arrow=r>=0?'↑':'↓';
    const clr=r>=0?'#3B6D11':'#A32D2D';
    return {txt:`${arrow} ${Math.abs(r*100).toFixed(1)}%`, clr};
  }

  // 集團、品牌合計
  let woMTD=0,woTgt=0,woLY=0,kiMTD=0,kiTgt=0,kiLY=0;
  WO_STORES.forEach(k=>{const x=sd(k);woMTD+=x.mtd;woTgt+=x.tgt;woLY+=lyRev(k);});
  KI_STORES.forEach(k=>{const x=sd(k);kiMTD+=x.mtd;kiTgt+=x.tgt;kiLY+=lyRev(k);});
  const totalMTD=woMTD+kiMTD, totalTgt=woTgt+kiTgt, totalLY=woLY+kiLY;
  const totalAch=totalTgt>0?totalMTD/totalTgt:null;
  const woAch=woTgt>0?woMTD/woTgt:null;
  const kiAch=kiTgt>0?kiMTD/kiTgt:null;

  function cardHtml(label,mtd,tgt,ach,lyr,dotColor){
    const barW=tgt>0?Math.min(100,mtd/tgt*100):0;
    const yoy=yoyTxt(mtd,lyr);
    const lyrStr=lyr?fmtM2(lyr):'—';
    return `<div class="sp-card">
      <div class="sp-card-label" style="color:${dotColor}">${label}</div>
      <div class="sp-card-rev">${fmtN(mtd)}</div>
      <div class="sp-card-ach" style="color:${achColor(ach)}">達成率 ${achTxt(ach)}</div>
      <div class="sp-card-yoy" style="color:${yoy.clr}">去年同期 ${yoy.txt}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:1px">
        <span style="font-size:11px;color:#aaa">去年同期業績</span>
        <span style="font-size:12px;font-weight:500;color:#888">${lyrStr}</span>
      </div>
      <div class="sp-card-bar-outer"><div class="sp-card-bar-inner" style="width:${barW}%;background:${dotColor}"></div></div>
      <div class="sp-card-tgt">目標 ${tgt>0?fmtM(tgt):'—'}</div>
    </div>`;
  }

  const cardsHtml = cardHtml('集團合計',totalMTD,totalTgt,totalAch,totalLY,'#555')
    + cardHtml('原渥',woMTD,woTgt,woAch,woLY,'#2d5a9e')
    + cardHtml('原綺',kiMTD,kiTgt,kiAch,kiLY,'#c04070');

  function storeRowHtml(sk){
    const d=DATA[sk]; if(!d) return '';
    const {mtd,tgt,ach}=sd(sk);
    const lyr=lyRev(sk);
    const yoy=yoyTxt(mtd,lyr);
    const barW=tgt>0?Math.min(100,mtd/tgt*100):0;
    const barColor=d.brandKey==='ki'?'#c04070':'#2d5a9e';
    return `<div class="sp-row">
      <div class="sp-sname">${d.label}</div>
      <div>
        <div class="sp-bar-outer"><div class="sp-bar-inner" style="width:${barW}%;background:${barColor}"></div></div>
        <div class="sp-rev-num">${fmtN(mtd)}</div>
      </div>
      <div class="sp-tgt-cell">${tgt>0?fmtM2(tgt):'—'}</div>
      <div class="sp-ach-cell ${achClass(ach)}">${achTxt(ach)}</div>
      <div class="sp-yoy-cell" style="color:#777">${lyr?fmtM2(lyr):'—'}</div>
      <div class="sp-yoy-cell" style="color:${yoy.clr};font-size:10px">${lyr?yoy.txt:''}</div>
    </div>`;
  }

  const colHd=`<div class="sp-col-hd"><span>門市</span><span>本月至今</span><span style="text-align:right">月目標</span><span style="text-align:center">達成率</span><span style="text-align:center">去年同期</span><span style="text-align:center">YoY</span></div>`;

  const bodyHtml = `
    <div class="sp-brand-hd wo">原渥</div>
    ${colHd}
    ${WO_STORES.map(storeRowHtml).join('')}
    <div class="sp-brand-hd ki" style="margin-top:4px">原綺</div>
    ${colHd}
    ${KI_STORES.map(storeRowHtml).join('')}
  `;

  document.getElementById('spSub').textContent = `${yr}年${mo}月 · 截至 ${mo}/${day}`;
  document.getElementById('spCards').innerHTML = cardsHtml;
  document.getElementById('spBody').innerHTML = bodyHtml;
  document.getElementById('spOverlay').classList.add('open');
}
function closeSpModal(){
  document.getElementById('spOverlay').classList.remove('open');
}

const _PROD_STORES = [
  {sk:'wo_zhanqian', label:'站前'},
  {sk:'wo_daan',     label:'大安'},

  {sk:'wo_banqiao',  label:'板橋'},
  {sk:'wo_dongmen',  label:'東門'},

// ══════════════════════════════════════════
//  週報簡表 Tab
// ══════════════════════════════════════════
(function(){
  const today = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const fmt = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  // 預設：本月1日到今天
  const m1 = new Date(today.getFullYear(), today.getMonth(), 1);
  window._wrMode = 'month';
  window._wrStart = fmt(m1);
  window._wrEnd   = fmt(today);
})();

function _wrSetRange(mode){
  const today = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const fmt = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if(mode==='week'){
    // 本週一到今天
    const dow = today.getDay()||7;
    const mon = new Date(today); mon.setDate(today.getDate()-(dow-1));
    window._wrStart = fmt(mon); window._wrEnd = fmt(today);
  } else if(mode==='lastweek'){
    const dow = today.getDay()||7;
    const lmon = new Date(today); lmon.setDate(today.getDate()-(dow-1)-7);
    const lsun = new Date(lmon); lsun.setDate(lmon.getDate()+6);
    window._wrStart = fmt(lmon); window._wrEnd = fmt(lsun);
  } else if(mode==='month'){
    const m1 = new Date(today.getFullYear(), today.getMonth(), 1);
    window._wrStart = fmt(m1); window._wrEnd = fmt(today);
  }
  window._wrMode = mode;
  renderWeeklyTab();
}

function renderWeeklyTab(){
  const el = document.getElementById('weekly-tab-body');
  if(!el) return;
  if(typeof CONSULTANT_RECORDS==='undefined'||!CONSULTANT_RECORDS.length){
    el.innerHTML='<div class="wr-empty">尚無數據</div>'; return;
  }

  // 月份篩選
  const today = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const fmt = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const moIdx = (typeof _wrMoIdx!=='undefined') ? _wrMoIdx : today.getMonth();
  const isCurWrMo = (moIdx === today.getMonth());
  const yr = today.getFullYear();
  const start = `${yr}-${pad(moIdx+1)}-01`;
  const end   = isCurWrMo ? fmt(today) : `${yr}-${pad(moIdx+1)}-${new Date(yr, moIdx+1, 0).getDate()}`;

  // 諮詢師記錄篩選月份
  const recs = CONSULTANT_RECORDS.filter(r=>r.date>=start&&r.date<=end);

  // MO_SNAP_DATA：門市業績來源
  const snap = (typeof MO_SNAP_DATA!=='undefined'&&MO_SNAP_DATA[moIdx])?MO_SNAP_DATA[moIdx]:{};

  // ── 輔助函數 ──
  const fmtN  = v=>'$'+Math.round(v).toLocaleString('zh-TW');
  const fmtM2 = v=>v>=10000?Math.round(v/10000)+'萬':(v/1000).toFixed(0)+'K';

  function achBadge(ach){
    if(ach===null) return '<span class="wr-badge">—</span>';
    const pct = Math.round(ach*100);
    const cls = ach>=1?'wr-badge-g':ach>=0.7?'wr-badge-y':'wr-badge-r';
    return `<span class="wr-badge ${cls}">${pct}%</span>`;
  }
  function rateColor(r){ return r===null?'#aaa':r>=70?'#3B6D11':r>=50?'#b07d00':'#A32D2D'; }

  // 從 MO_SNAP_DATA 取門市業績與目標
  function getSnapRev(sk){ return (snap[sk]&&snap[sk].total_rev)||0; }
  function getTarget(sk){
    const s=snap[sk]||{}, d=DATA[sk]||{};
    return s.target||(d.monthly_tgt?d.monthly_tgt[moIdx]:0)||(d.target_h1?Math.round(d.target_h1/6):0)||0;
  }

  // 產品金額從 localStorage 讀（透過填寫視窗更新）
  function calcStoreProd(sk){ return getStoreProd(sk, moIdx); }

  // 計算門市/諮詢師數據（與諮詢師詳情頁公式一致）
  // storeLevel=true：含分享客(其他)在接待數，用於店的 strip
  // storeLevel=false：只計新客，用於諮詢師個人列
  function calcConsultant(csRecs, storeLevel=false){
    let 接待=0, 成交=0, totalAmt=0;
    csRecs.forEach(r=>r.clients.forEach(c=>{
      if(c.type==='新客'){
        接待++;
        const pAmt = c.product_amt||0;
        totalAmt += pAmt;
        if(c.total_amt>0){ 成交++; totalAmt+=c.total_amt; }
      } else if(c.type==='其他' && storeLevel){
        接待++; // 分享客計入接待，不計成交
      }
    }));
    const 成交率 = 接待>0?Math.round(成交/接待*100):null;
    const 客單   = 接待>0?Math.round(totalAmt/接待):null;
    return {接待,成交,成交率,客單};
  }

  function ncStripHtml(storeRecs, cls){
    const {接待,成交,成交率,客單} = calcConsultant(storeRecs, true); // 含分享客
    if(!接待) return '';
    const rCls = 成交率===null?'':成交率>=70?'green':成交率>=50?'amber':'red';
    const fmtN2 = v=>'$'+Math.round(v).toLocaleString('zh-TW');
    return `<div class="wr-nc-strip ${cls}">
      <div class="wr-nc-cell"><span class="wr-nc-val">${接待}</span><span class="wr-nc-lbl">新客接待</span></div>
      <div class="wr-nc-cell"><span class="wr-nc-val">${成交}</span><span class="wr-nc-lbl">成交</span></div>
      <div class="wr-nc-cell"><span class="wr-nc-val ${rCls}">${成交率!==null?成交率+'%':'—'}</span><span class="wr-nc-lbl">成交率</span></div>
      <div class="wr-nc-cell"><span class="wr-nc-val">${客單?fmtN2(客單):'—'}</span><span class="wr-nc-lbl">客單</span></div>
    </div>`;
  }

  // 取諮詢師列表（排除公司，按 STORE_CS_ORDER 排序）
  function getConsultants(storeRecs, sk){
    const present = new Set(storeRecs.map(r=>r.consultant).filter(c=>c&&c!=='公司'));
    const order = (STORE_CS_ORDER&&STORE_CS_ORDER[sk]) || [];
    const sorted = order.filter(c=>present.has(c));
    present.forEach(c=>{ if(!sorted.includes(c)) sorted.push(c); });
    return sorted;
  }

  function csRowsHtml(storeRecs, sk){
    const cs = getConsultants(storeRecs, sk);
    if(!cs.length) return '';
    const colHd = `<div class="wr-col-hd"><span>諮詢師</span><span style="text-align:center">新客/成交</span><span style="text-align:center">成交率</span><span style="text-align:right">客單</span></div>`;
    const rows = cs.map(c=>{
      const cr = storeRecs.filter(r=>r.consultant===c);
      const {接待,成交,成交率,客單} = calcConsultant(cr);
      const rateClr = rateColor(成交率);
      const nick = (NICKNAMES&&NICKNAMES[c])?`<span class="wr-cs-nick">${NICKNAMES[c]}</span>`:'';
      const title = (CONSULTANT_TITLES&&CONSULTANT_TITLES[c])?`<div class="wr-cs-title">${CONSULTANT_TITLES[c]}</div>`:'';
      return `<div class="wr-cs-row">
        <span class="wr-cs-name" style="display:flex;flex-direction:column;gap:0"><span>${c}${nick}</span>${title}</span>
        <span class="wr-cs-nc">${接待}/${成交}</span>
        <span class="wr-cs-rate" style="color:${rateClr}">${成交率!==null?成交率+'%':'—'}</span>
        <span class="wr-cs-amt">${客單?fmtN(客單):'—'}</span>
      </div>`;
    }).join('');
    return colHd+rows;
  }

  // ── 獨立門市卡 ──
  function soloSectionHtml(sk, barColor){
    const d = DATA[sk]; if(!d) return '';
    const storeRecs = recs.filter(r=>r.storeKey===sk);
    const rev  = getSnapRev(sk);
    const prod = calcStoreProd(sk);
    const tgt  = getTarget(sk);
    const ach  = tgt>0?rev/tgt:null;
    const barW = tgt>0?Math.min(100,rev/tgt*100):0;
    const prodHtml = prod>0?`<span class="wr-sec-prod"><span class="wr-sec-prod-lbl">產品</span>${fmtN(prod)}</span>`:'';

    return `<div class="wr-section">
      <div class="wr-sec-hd">
        <span class="wr-sec-name">${d.label}</span>
        <div class="wr-sec-revs"><span class="wr-sec-rev">${fmtN(rev)}</span>${prodHtml}</div>
        <span class="wr-sec-tgt">目標 ${tgt?fmtM2(tgt):'—'}</span>
        ${achBadge(ach)}
      </div>
      <div class="wr-bars">
        <div class="wr-bar-outer"><div class="wr-bar-inner" style="width:${barW}%;background:${barColor}"></div></div>
      </div>
      ${ncStripHtml(storeRecs,'solo')}
      ${csRowsHtml(storeRecs, sk)}
    </div>`;
  }

  // ── 雙品牌門市（台北/台中）卡 ──
  function dualSectionHtml(label, kiKey, woKey, kiLabel, woLabel){
    const kiRecs = recs.filter(r=>r.storeKey===kiKey);
    const woRecs = recs.filter(r=>r.storeKey===woKey);
    const kiRev  = getSnapRev(kiKey);
    const woRev  = getSnapRev(woKey);
    const kiProd = calcStoreProd(kiKey);
    const woProd = calcStoreProd(woKey);
    const total  = kiRev + woRev;
    const kiTgt  = getTarget(kiKey);
    const woTgt  = getTarget(woKey);
    const tgt    = kiTgt + woTgt;
    const ach    = tgt>0?total/tgt:null;
    const barW   = tgt>0?Math.min(100,total/tgt*100):0;
    const kiBarW = kiTgt>0?Math.min(100,kiRev/kiTgt*100):0;
    const woBarW = woTgt>0?Math.min(100,woRev/woTgt*100):0;
    const kiLbl  = DATA[kiKey]?.brand||'原綺';
    const woLbl  = DATA[woKey]?.label||'原渥';

    const kiLblTxt = `${kiLbl} ${fmtN(kiRev)}${kiProd?` 產品 ${fmtN(kiProd)}`:''}`;
    const woLblTxt = `${woLbl} ${fmtN(woRev)}${woProd?` 產品 ${fmtN(woProd)}`:''}`;

    const kiCsRows = csRowsHtml(kiRecs, kiKey);
    const woCsRows = csRowsHtml(woRecs, woKey);
    const kiName = kiLabel || DATA[kiKey]?.brand||'原綺';
    const woName = woLabel || DATA[woKey]?.brand||'原渥';

    return `<div class="wr-section">
      <div class="wr-sec-hd">
        <span class="wr-sec-name">${label}</span>
        <div class="wr-sec-revs"><span class="wr-sec-rev">${fmtN(total)}</span></div>
        <span class="wr-sec-tgt">目標 ${tgt?fmtM2(tgt):'—'}</span>
        ${achBadge(ach)}
      </div>
      <div class="wr-bars">
        <div class="wr-bar-outer"><div class="wr-bar-inner" style="width:${barW}%;background:#888"></div></div>
        <div class="wr-dual-grid">
          <div>
            <div class="wr-bar-lbl">${kiLblTxt}</div>
            <div class="wr-bar-outer"><div class="wr-bar-inner" style="width:${kiBarW}%;background:#c04070"></div></div>
          </div>
          <div>
            <div class="wr-bar-lbl">${woLblTxt}</div>
            <div class="wr-bar-outer"><div class="wr-bar-inner" style="width:${woBarW}%;background:#2d5a9e"></div></div>
          </div>
        </div>
      </div>
      ${kiCsRows?`<div class="wr-brand-subhd ki">${kiName}</div>${ncStripHtml(kiRecs,'ki')}${kiCsRows}`:''}
      ${woCsRows?`<div class="wr-brand-subhd wo">${woName}</div>${ncStripHtml(woRecs,'wo')}${woCsRows}`:''}
    </div>`;
  }

  // ── 渲染 ──
  const mo = moIdx+1;
  // 月份切換 pills（只顯示有資料的月份，最多到當月）
  const loadedMos = (typeof MO_SNAP_DATA!=='undefined')
    ? Object.keys(MO_SNAP_DATA).map(Number).filter(i=>i<=today.getMonth()).sort((a,b)=>a-b)
    : [today.getMonth()];
  const MO_NAMES_SHORT = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const pillsHtml = loadedMos.map(i=>`<button class="mo-tab-btn${i===moIdx?' active':''}" onclick="switchWrMo(${i})" style="font-size:11px;padding:3px 8px">${MO_NAMES_SHORT[i]}</button>`).join('');
  const header = `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;gap:8px;flex-wrap:wrap">
    <div class="mo-tabs-wrap" style="gap:4px;flex-wrap:wrap">${pillsHtml}</div>
    <button class="prod-edit-btn" onclick="openProdModal()">✎ 填寫產品業績</button>
  </div>
  <div style="font-size:11px;color:#999;padding-bottom:8px">${yr}年${mo}月 ${isCurWrMo?'本月至今':'全月'}</div>`;
  const grid = `<div class="wr-grid">
    ${soloSectionHtml('wo_zhanqian','#2d5a9e')}
    ${soloSectionHtml('wo_daan','#2d5a9e')}
    ${soloSectionHtml('wo_zhongxiao','#2d5a9e')}
    ${soloSectionHtml('wo_banqiao','#2d5a9e')}
    ${dualSectionHtml('台北','ki_taipei','wo_dongmen','台北原綺','原渥東門')}
    ${dualSectionHtml('台中','ki_taichung','wo_taichung','台中原綺','原渥台中')}
  </div>`;

  el.innerHTML = header + grid;
}

function renderNcModal(){
  const now = new Date();
  const moIdx = (typeof _curMoTab!=='undefined') ? _curMoTab : now.getMonth();
  const isCurMo = (moIdx === now.getMonth());
  const mo = moIdx + 1;
  const daysInMo = new Date(now.getFullYear(), moIdx+1, 0).getDate();
  const day = isCurMo ? Math.max(1, now.getDate()-1) : daysInMo;
  const ratio = day / daysInMo;

  document.getElementById('ncSub').textContent =
    `${mo}/1–${mo}/${day} · 應達 = 月目標 × ${day}/${daysInMo}`;

  // Gather current new_n from latest loaded monthly data
  const moData = MO_SNAP_DATA[_curMoTab] || {};

  function getCur(key){ return (moData[key]||{}).new_n || 0; }
  function calcDue(key){ return Math.ceil((NC_TGT[key]||0) * ratio); }

  function mkRow(key, clr){
    const cur = getCur(key);
    const due = calcDue(key);
    const tgt = NC_TGT[key] || 0;
    const ok  = cur >= due;
    const numClr = ok ? '#1a6b3c' : '#c0392b';
    const pct  = tgt > 0 ? Math.min(cur/tgt*100, 100).toFixed(1) : 0;
    const tpct = tgt > 0 ? Math.min(due/tgt*100, 100).toFixed(1) : 0;
    const tgtCell = _ncEditing
      ? `<input class="nc-tgt-inp" type="number" value="${tgt}" min="1"
           onchange="NC_TGT['${key}']=+this.value;renderNcModal()">`
      : `<span class="nc-tgt">${tgt}</span>`;
    return `<div class="nc-row">
      <span class="nc-rname">${NC_STORE_LABELS[key]||key}</span>
      <div style="padding-right:6px">
        <div class="nc-bar-outer">
          <div class="nc-bar-inner" style="width:${pct}%;background:${clr}"></div>
          <div class="nc-tick" style="left:${tpct}%"></div>
        </div>
      </div>
      <span class="nc-nums" style="color:${numClr}">${cur} / ${due}</span>
      <div style="text-align:right">${tgtCell}</div>
      <span class="nc-ic">${ok ? '✅' : '❗️'}</span>
    </div>`;
  }

  const colHd = `<div class="nc-col-hd">
    <span>門市</span><span></span>
    <span style="text-align:right">目前/應達</span>
    <span style="text-align:right">目標</span><span></span>
  </div>`;

  let html = '';
  html += `<div class="nc-sec-hd">
    <div class="nc-brand-dot" style="background:#2d5a9e"></div>
    <span class="nc-sec-label" style="color:#1a3a6e">原渥</span>
  </div>${colHd}`;
  html += WO_STORES.map(k => mkRow(k, '#2d5a9e')).join('');

  html += `<div class="nc-sec-hd" style="margin-top:4px">
    <div class="nc-brand-dot" style="background:#c04070"></div>
    <span class="nc-sec-label" style="color:#8c2044">原綺</span>
  </div>${colHd}`;
  html += KI_STORES.map(k => mkRow(k, '#c04070')).join('');

  document.getElementById('ncBody').innerHTML = html;

  const allKeys = [...WO_STORES, ...KI_STORES];
  const okCnt = allKeys.filter(k => getCur(k) >= calcDue(k)).length;
  const ngCnt = allKeys.length - okCnt;
  document.getElementById('ncPills').innerHTML =
    `<span class="nc-pill nc-pill-ok">${okCnt} 達標</span>
     <span class="nc-pill nc-pill-ng">${ngCnt} 落後</span>`;
}
</script>

<script>
function openCSPrintPreview(){
  // 重用 renderConsultantTab 裡的篩選邏輯取得 records
  const now = new Date();
  const fmt = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayStr = fmt(now);
  const yest = new Date(now); yest.setDate(yest.getDate()-1);
  const yestStr = fmt(yest);
  const records = CONSULTANT_RECORDS.filter(r=>{
    if(_csMode==='today')     return r.date===todayStr;
    if(_csMode==='yesterday') return r.date===yestStr;
    if(_csMode==='month')     return r.date.startsWith(_csMonth);
    if(_csMode==='custom')    return r.date>=_csStart && r.date<=_csEnd;
    return false;
  });

  // 標題時間標籤
  let rangeLabel='';
  if(_csMode==='today') rangeLabel=todayStr.replace(/-/g,'/');
  else if(_csMode==='yesterday') rangeLabel=yestStr.replace(/-/g,'/');
  else if(_csMode==='month') rangeLabel=`${_csMonth.replace('-','年')}月`;
  else rangeLabel=`${_csStart.slice(5).replace('-','/')} ～ ${_csEnd.slice(5).replace('-','/')}`;

  function calcNew(recs){
    let 接待=0,成交=0,amt=0;
    recs.forEach(r=>r.clients.forEach(c=>{
      if(c.type==='新客'){
        接待++;
        const pAmt=c.product_amt||0;
        amt+=pAmt;
        if(c.total_amt>0){成交++;amt+=c.total_amt;}
      } else if(c.type==='其他'){
        接待++; // 分享客計入接待，不計成交
      }
    }));
    const 成交率=接待>0?Math.round(成交/接待*100):null;
    const 客單=接待>0?Math.round(amt/接待):null;
    return{接待,成交,成交率,客單};
  }
  function calcRet(recs){
    let totalOld=0,newTrial=0,purchased=0,rev=0;
    recs.forEach(r=>r.clients.forEach(c=>{
      if(c.type==='舊客') totalOld++;
      else if(c.type==='舊客體驗'){
        totalOld++;newTrial++;
        rev+=c.trial_amt;
        if(c.total_amt>0){purchased++;rev+=c.total_amt;}
      }
    }));
    const 成交率=newTrial>0?Math.round(purchased/newTrial*100):null;
    return{totalOld,newTrial,purchased,成交率,rev};
  }
  function rateClr(r){return r===null?'cs-print-dim':r>=70?'cs-print-rate-ok':r>=50?'cs-print-rate-mid':'cs-print-rate-lo';}
  function fmtAmt(v){return v===null?'<span class="cs-print-dim">—</span>':'$'+v.toLocaleString();}
  function fmtRate(r){return r===null?'<span class="cs-print-dim">—</span>':`<span class="${rateClr(r)}">${r}%</span>`;}

  // 按品牌→門市→諮詢師組織
  const BRAND_ORDER=[{key:'wo',label:'原渥',color:'#2d5a9e'},{key:'ki',label:'原綺',color:'#c04070'}];
  const STORE_ORDER=['wo_zhanqian','wo_daan','wo_zhongxiao','wo_banqiao','wo_dongmen','wo_taichung','ki_taipei','ki_taichung'];
  const STORE_NAMES={wo_zhanqian:'站前',wo_daan:'大安',wo_zhongxiao:'忠孝',wo_banqiao:'板橋',wo_dongmen:'東門',wo_taichung:'台中',ki_taipei:'台北',ki_taichung:'台中'};

  // 原綺舊客回約月數據
  const _pRefMonth=_csMode==='month'?_csMonth:_csMode==='today'?todayStr.slice(0,7):_csMode==='yesterday'?yestStr.slice(0,7):(_csStart||'').slice(0,7);
  const _pKiStore=KI_REBOOK_STORE_DATA[_pRefMonth]||{};
  const _pKiCs=KI_REBOOK_CS_DATA[_pRefMonth]||{};

  // 雙品牌各自獨立渲染，欄位定義不同
  let woBody='', kiBody='';
  BRAND_ORDER.forEach(({key:bk,label:bl,color:bc})=>{
    const storeKeys=STORE_ORDER.filter(sk=>sk.startsWith(bk));
    let brandNewTotal={接待:0,成交:0,amt:0};
    let brandRetTotal={totalOld:0,newTrial:0,purchased:0,rev:0,取消:0};
    const storeBlocks=[];
    storeKeys.forEach(sk=>{
      const srecs=records.filter(r=>r.storeKey===sk);
      const kiStoreRebook=bk==='ki'?(_pKiStore[sk]||null):null;
      const kiCsRebook=bk==='ki'?(_pKiCs[sk]||{}):{};
      if(!srecs.length && !kiStoreRebook) return;
      const _prt=new Set(srecs.map(r=>r.consultant).filter(c=>c!=='公司'));
      if(bk==='ki') Object.keys(kiCsRebook).forEach(c=>_prt.add(c));
      const _ord=STORE_CS_ORDER[sk]||[];
      const consultants=[..._ord.filter(c=>_prt.has(c)),...[..._prt].filter(c=>!_ord.includes(c))];
      if(!consultants.length && !kiStoreRebook) return;
      let storeRows='';
      let sNewTot={接待:0,成交:0,amt:0};
      let sRetTot={totalOld:0,newTrial:0,purchased:0,rev:0,取消:0};
      consultants.forEach(c=>{
        const cr=srecs.filter(r=>r.consultant===c);
        const n=calcNew(cr);
        let ret;
        if(bk==='ki'){
          const rb=kiCsRebook[c]||null;
          ret=rb?{totalOld:rb.回約,取消:rb.取消,newTrial:rb.回約-rb.取消,purchased:null,成交率:null,rev:rb.業績}:{totalOld:0,取消:0,newTrial:0,purchased:null,成交率:null,rev:0};
        } else {
          ret=calcRet(cr);
        }
        const nick=NICKNAMES[c]?`<span class="cs-print-nick">${NICKNAMES[c]}</span>`:'';
        const ptitle=CONSULTANT_TITLES[c]?`<span class="cs-print-nick">${CONSULTANT_TITLES[c]}</span>`:'';
        const newCols=`<td>${n.接待||'<span class="cs-print-dim">0</span>'}</td><td>${n.成交||'<span class="cs-print-dim">0</span>'}</td><td>${fmtRate(n.成交率)}</td><td>${fmtAmt(n.客單)}</td>`;
        const retCols=bk==='wo'
          ?`<td>${ret.totalOld||'<span class="cs-print-dim">0</span>'}</td><td>${ret.newTrial||'<span class="cs-print-dim">0</span>'}</td><td>${fmtRate(ret.成交率)}</td><td>${ret.rev>0?'$'+ret.rev.toLocaleString():'<span class="cs-print-dim">—</span>'}</td>`
          :`<td>${ret.totalOld||'<span class="cs-print-dim">0</span>'}</td><td>${ret.取消>0?ret.取消:'<span class="cs-print-dim">0</span>'}</td><td>${ret.newTrial||'<span class="cs-print-dim">0</span>'}</td><td>${ret.rev>0?'$'+ret.rev.toLocaleString():'<span class="cs-print-dim">—</span>'}</td>`;
        storeRows+=`<tr class="pt-cs"><td></td><td>${c}${nick}${ptitle}</td>${newCols}${retCols}</tr>`;
        sNewTot.接待+=n.接待;sNewTot.成交+=n.成交;
        if(n.客單!==null) sNewTot.amt+=n.客單*n.接待;
        sRetTot.totalOld+=ret.totalOld;sRetTot.newTrial+=ret.newTrial;sRetTot.取消+=ret.取消||0;
        if(ret.purchased) sRetTot.purchased+=ret.purchased;
        sRetTot.rev+=ret.rev;
      });
      // 將「公司」底下的客人也計入小計（不顯示獨立列）
      const compRecs=srecs.filter(r=>r.consultant==='公司');
      if(compRecs.length){
        const cn=calcNew(compRecs);
        const cret=bk==='ki'?{totalOld:0,newTrial:0,purchased:0,rev:0,取消:0}:calcRet(compRecs);
        sNewTot.接待+=cn.接待;sNewTot.成交+=cn.成交;
        if(cn.客單!==null) sNewTot.amt+=cn.客單*cn.接待;
        sRetTot.totalOld+=cret.totalOld;sRetTot.newTrial+=cret.newTrial;sRetTot.取消+=cret.取消||0;
        if(cret.purchased) sRetTot.purchased+=cret.purchased;
        sRetTot.rev+=cret.rev;
      }
      // 門市小計
      const sNr=sNewTot.接待>0?Math.round(sNewTot.成交/sNewTot.接待*100):null;
      const sNk=sNewTot.接待>0?Math.round(sNewTot.amt/sNewTot.接待):null;
      const sRr=sRetTot.newTrial>0?Math.round(sRetTot.purchased/sRetTot.newTrial*100):null;
      // 原綺：沒有 CS 資料時用 store-level 數據 (KI_REBOOK_STORE_DATA) 補小計
      const kiFallback=bk==='ki'&&sRetTot.totalOld===0&&kiStoreRebook
        ?{totalOld:kiStoreRebook.舊客,取消:0,newTrial:kiStoreRebook.舊客,rev:kiStoreRebook.業績}:null;
      const effRet=kiFallback||sRetTot;
      const subRetCols=bk==='wo'
        ?`<td>${sRetTot.totalOld}</td><td>${sRetTot.newTrial}</td><td>${fmtRate(sRr)}</td><td>${sRetTot.rev>0?'$'+sRetTot.rev.toLocaleString():'<span class="cs-print-dim">—</span>'}</td>`
        :`<td>${effRet.totalOld||'<span class="cs-print-dim">0</span>'}</td><td>${effRet.取消>0?effRet.取消:'<span class="cs-print-dim">—</span>'}</td><td>${effRet.newTrial||'<span class="cs-print-dim">0</span>'}</td><td>${effRet.rev>0?'$'+effRet.rev.toLocaleString():'<span class="cs-print-dim">—</span>'}</td>`;
      storeRows+=`<tr class="pt-sub${bk==='ki'?' ki':''}"><td></td><td style="color:#555">${STORE_NAMES[sk]} 小計${kiFallback?'<span style="font-size:9px;color:#bbb;margin-left:4px">門市</span>':''}</td><td>${sNewTot.接待}</td><td>${sNewTot.成交}</td><td>${fmtRate(sNr)}</td><td>${fmtAmt(sNk)}</td>${subRetCols}</tr>`;
      storeBlocks.push({sk,rows:storeRows,sNewTot,effRet});
      brandNewTotal.接待+=sNewTot.接待;brandNewTotal.成交+=sNewTot.成交;brandNewTotal.amt+=sNewTot.amt;
      brandRetTotal.totalOld+=effRet.totalOld;brandRetTotal.newTrial+=effRet.newTrial;brandRetTotal.取消+=effRet.取消||0;brandRetTotal.purchased+=effRet.purchased||0;brandRetTotal.rev+=effRet.rev;
    });
    if(!storeBlocks.length) return;
    let bRows=`<tbody>`;
    bRows+=`<tr class="pt-brand${bk==='ki'?' ki':''}"><td colspan="10">${bl}</td></tr>`;
    storeBlocks.forEach(({sk,rows:sr})=>{
      bRows+=`<tr class="pt-store ${bk}"><td colspan="10">${STORE_NAMES[sk]}</td></tr>`;
      bRows+=sr;
    });
    const bNr=brandNewTotal.接待>0?Math.round(brandNewTotal.成交/brandNewTotal.接待*100):null;
    const bNk=brandNewTotal.接待>0?Math.round(brandNewTotal.amt/brandNewTotal.接待):null;
    const bRr=brandRetTotal.newTrial>0?Math.round(brandRetTotal.purchased/brandRetTotal.newTrial*100):null;
    const totRetCols=bk==='wo'
      ?`<td>${brandRetTotal.totalOld}</td><td>${brandRetTotal.newTrial}</td><td>${fmtRate(bRr)}</td><td>${brandRetTotal.rev>0?'$'+brandRetTotal.rev.toLocaleString():'<span class="cs-print-dim">—</span>'}</td>`
      :`<td>${brandRetTotal.totalOld}</td><td>${brandRetTotal.取消}</td><td>${brandRetTotal.newTrial}</td><td>${brandRetTotal.rev>0?'$'+brandRetTotal.rev.toLocaleString():'<span class="cs-print-dim">—</span>'}</td>`;
    bRows+=`<tr class="pt-sub${bk==='ki'?' ki':''}"><td></td><td style="font-weight:600;color:${bc}">${bl} 合計</td><td>${brandNewTotal.接待}</td><td>${brandNewTotal.成交}</td><td>${fmtRate(bNr)}</td><td>${fmtAmt(bNk)}</td>${totRetCols}</tr></tbody>`;
    if(bk==='wo') woBody=bRows;
    else kiBody=bRows;
  });

  const mkHd=(brand)=>`<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px">
    <div style="font-size:14px;font-weight:600;color:#1a1a18">${brand}諮詢師成交明細<span class="cs-print-range">${rangeLabel}</span></div>
    <div style="font-size:10px;color:#bbb">原渥集團</div>
  </div>`;
  const woSection=woBody?`${mkHd('原渥 ')}<table class="cs-print-tbl"><thead><tr>
    <th style="width:32px"></th><th style="width:110px">諮詢師</th>
    <th>新客<br>接待</th><th>新客<br>成交</th><th>新客<br>成交率</th><th>平均<br>客單</th>
    <th>舊客<br>接待</th><th>新體驗<br>人數</th><th>體驗<br>成交率</th><th>舊客<br>業績</th>
  </tr></thead>${woBody}</table>`:'';
  const kiSection=kiBody?`<div style="page-break-before:always;padding-top:4px">${mkHd('原綺 ')}<table class="cs-print-tbl"><thead><tr>
    <th style="width:32px"></th><th style="width:110px">諮詢師</th>
    <th>新客<br>接待</th><th>新客<br>成交</th><th>新客<br>成交率</th><th>平均<br>客單</th>
    <th>回約</th><th>取消</th><th>到場</th><th>舊客<br>業績</th>
  </tr></thead>${kiBody}</table></div>`:'';
  const html=woSection+kiSection;

  document.getElementById('csPrintBody').innerHTML=html;
  document.getElementById('csPrintOverlay').classList.add('open');
}
function closeCSPrint(){document.getElementById('csPrintOverlay').classList.remove('open');}
function doCSPrint(){window.print();}
</script>
