<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA LUEUR 原渥集團 業績統計儀表板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC',sans-serif;background:#f5f4f0;color:#1a1a18;font-size:13px;line-height:1.5}
/* ── Header ── */
.site-header{background:#000;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.header-inner{display:flex;align-items:center;gap:18px;padding:14px 32px;height:81px;max-width:1600px;margin:0 auto;overflow:hidden}
.logo-svg{flex-shrink:0}
.header-divider{width:1px;height:42px;background:#2a2a2a;flex-shrink:0}
.header-text{display:flex;flex-direction:column;gap:3px}
.header-title{font-size:16px;font-weight:700;color:#e5e7eb;letter-spacing:.3px}
.header-sub{font-size:11px;color:#4b5563}
/* ── Nav bar ── */
.nav-bar{background:#000;border-bottom:1px solid #222;position:sticky;top:81px;z-index:99}
.nav-inner{display:flex;align-items:center;padding:0 32px;height:44px;gap:6px;max-width:1600px;margin:0 auto}
.nav-item{font-size:12px;padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:500;background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);transition:background .15s;white-space:nowrap}
.nav-item:hover:not(.active){background:rgba(255,255,255,.13)}
.nav-item.active{background:#fff;color:#111}
.nav-filter{margin-left:auto;display:flex;align-items:center;gap:8px;border-left:1px solid rgba(255,255,255,.1);padding-left:14px}
.filter-label{font-size:12px;color:rgba(255,255,255,.4);margin-right:2px}
.nav-filter select{background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);border:0.5px solid rgba(255,255,255,.15);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.nav-filter select option{background:#111}
/* ── Layout ── */
.page{max-width:1600px;margin:0 auto;padding:16px 32px}
.tab-content{display:none}
.tab-content.active{display:block}
/* ── Top KPI ── */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi-card{background:#fff;border:0.5px solid rgba(0,0,0,.08);border-radius:10px;padding:12px 16px}
.kpi-label{font-size:10px;color:#888780;margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:700;color:#1a1a18;letter-spacing:-.5px}
.kpi-sub{font-size:10px;margin-top:3px}
.up{color:#2a7a4a}.down{color:#c0392b}.flat{color:#888780}
/* ── Brand Group ── */
.brand-group{margin-bottom:14px}
.brand-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:8px}
.brand-bar.ki{background:#edf2ff}
.brand-bar.wo{background:#fff1f1}
.brand-name{font-size:12px;font-weight:700;letter-spacing:.5px}
.brand-sum{font-size:10px;color:#888780}
.brand-warn{margin-left:auto;font-size:10px;font-weight:600;color:#c0392b}
.brand-src{margin-left:auto;display:flex;gap:10px;align-items:center}
.src-item{display:flex;align-items:center;gap:4px;font-size:9px;color:#555}
.src-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* ── Store Cards ── */
.stores-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stores-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sc{background:#fff;border:0.5px solid rgba(0,0,0,.09);border-radius:10px;padding:12px 13px}
.sc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:0.5px solid rgba(0,0,0,.06)}
.sc-name{font-size:13px;font-weight:700;color:#1a1a18}
.sc-sub{font-size:9px;color:#888780;margin-top:1px}
.sc-badge{font-size:9px;padding:2px 7px;border-radius:12px;font-weight:600;margin-left:auto}
.badge-g{background:#d4edda;color:#1a6b3c}
.badge-y{background:#fff3cd;color:#856404}
.badge-r{background:#fce4e4;color:#c0392b}
/* ── Metrics table in card ── */
.mt{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:9px}
.mt th{color:#888780;font-weight:500;padding:3px 4px;text-align:right;border-bottom:0.5px solid rgba(0,0,0,.07);white-space:nowrap}
.mt th:first-child{text-align:left;font-size:9px}
.mt td{padding:3px 4px;text-align:right;border-bottom:0.5px solid rgba(0,0,0,.04);color:#1a1a18}
.mt td:first-child{text-align:left;font-weight:600;color:#444;font-size:9px}
.mt .total-row td{font-weight:700;background:#fafaf8;border-top:0.5px solid rgba(0,0,0,.08);border-bottom:none}
.mt .section-row td{background:#f5f3ee;font-size:8.5px;color:#888780;padding:2px 4px}
/* ── Revenue mix bar ── */
.mix-wrap{margin-bottom:9px}
.mix-label{display:flex;justify-content:space-between;margin-bottom:3px}
.mix-label span{font-size:9px;color:#888780}
.mix-bar{height:6px;border-radius:3px;overflow:hidden;display:flex;background:#f0ede8}
/* ── Progress bar ── */
.prog-wrap{margin-bottom:9px}
.prog-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.prog-label span{font-size:9px;color:#888780}
.prog-label strong{font-size:11px;font-weight:700}
.prog-bar{height:8px;background:#ede9e3;border-radius:4px;overflow:hidden;position:relative}
.prog-fill{height:100%;border-radius:4px;transition:width .4s}
/* ── Hist chart ── */
.hch-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.hch-panel{background:#fff;border:.5px solid var(--border,rgba(0,0,0,.09));border-radius:12px;padding:13px 12px 10px;overflow:hidden}
.hch-ph{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.hch-pd{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.hch-pn{font-size:12px;font-weight:700}
.hch-pt{font-size:10px;color:#888780;margin-left:auto}
.hch-chart{display:flex;align-items:flex-end;gap:3px;height:130px;border-bottom:.5px solid rgba(0,0,0,.07);position:relative}
.hch-yl{position:absolute;left:0;right:0;border-top:.5px dashed rgba(0,0,0,.06);pointer-events:none}
.hch-bw{display:flex;flex-direction:column;align-items:center;flex:1;height:100%;justify-content:flex-end}
.hch-bv{font-size:7.5px;font-weight:600;color:#444;margin-bottom:2px;text-align:center;line-height:1.3}
.hch-ytd-lbl{color:#888780}
.hch-bar{border-radius:3px 3px 0 0;width:100%}
.hch-ytd{opacity:.5}
.hch-xl{display:flex;gap:3px;margin-top:5px}
.hch-xi{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.hch-xn{font-size:8px;color:#888780;text-align:center}
.hch-cur{color:#444;font-weight:500}
.hch-yoy{font-size:7.5px;font-weight:600;padding:1px 3px;border-radius:3px}
.hch-up{color:#1a6b3c;background:rgba(26,107,60,.1)}
.hch-dn{color:#c0392b;background:rgba(180,30,30,.1)}
.hch-na{color:#888780}
.hch-sum{display:flex;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:.5px solid rgba(0,0,0,.06)}
.hch-sum-item{text-align:center}
.hch-sv{font-size:11px;font-weight:600;color:#1a1a18}
.hch-sl{font-size:8px;color:#888780;margin-top:1px}
.hch-note{font-size:9.5px;color:#888780;margin-bottom:12px}
.hch-xi-lbl{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;padding-right:3px;margin-right:0}
.hch-xi-lbl-r{visibility:hidden;display:block}
.hch-xi-lbl-r:first-child{font-size:8px;line-height:1.5}
.hch-xi-lbl-r:nth-child(2){font-size:7.5px;line-height:1.5;padding:1px 3px}
.hch-xi-lbl-t{font-size:7.5px;color:#aaa;font-weight:500;white-space:nowrap;line-height:1.5}
.hch-tgt-v{font-size:7.5px;color:#aaa;display:block;text-align:center;min-height:1em;line-height:1.5}
.hch-xi-lbl-div{display:block;align-self:stretch;border-top:.5px dashed rgba(0,0,0,.08);margin:2px 0}
.hch-tgt-grp{border-top:.5px dashed rgba(0,0,0,.08);padding-top:2px;margin-top:2px;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
/* ── Monthly bars ── */
.month-sec{margin-bottom:0}
.month-sec-label{font-size:9px;font-weight:600;color:#444;margin-bottom:4px}
.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.mc{text-align:center}
.mc-wrap{height:32px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:2px}
.mc-bar{width:13px;border-radius:2px 2px 0 0}
.mc-pct{font-size:7.5px;font-weight:700}
.mc-lbl{font-size:7.5px;color:#888780}
/* ── Divider ── */
.divider{height:0.5px;background:rgba(0,0,0,.07);margin:8px 0}
/* ── 業績總表 ── */
.tbl-section{margin-bottom:14px}
.tbl-brand-bar{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:7px;margin-bottom:8px}
.store-tables{display:grid;gap:10px}
.store-tbl-card{background:#fff;border:0.5px solid rgba(0,0,0,.09);border-radius:12px;overflow:hidden}
.store-tbl-title{font-size:11px;font-weight:700;color:#1a1a18;margin-bottom:8px;display:flex;align-items:center;gap:7px}
/* store header */
.store-hd{padding:14px 16px;border-bottom:0.5px solid rgba(0,0,0,.07)}
.store-hd-name{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.store-name-big{font-size:21px;font-weight:500}
.store-summary-top{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.store-summary-left{}
.store-rev-big{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:4px 0 2px}
.store-summary-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.store-met{background:#f5f3ee;border-radius:7px;padding:8px 4px;text-align:center}
.store-met-v{font-size:13px;font-weight:500}
.store-met-l{font-size:9px;color:#aaa;margin-top:1px}
/* table */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.perf-tbl{width:100%;border-collapse:collapse;font-size:10px}
.perf-tbl th{color:#888780;font-weight:500;padding:5px 8px;text-align:right;border-bottom:0.5px solid rgba(0,0,0,.08);white-space:nowrap;background:#fafaf8}
.perf-tbl th:first-child{text-align:left;position:sticky;left:0;z-index:2;background:#fafaf8}
.perf-tbl td{padding:5px 8px;text-align:right;color:#1a1a18;border-bottom:0.5px solid rgba(0,0,0,.04)}
.perf-tbl td:first-child{text-align:left;color:#444;position:sticky;left:0;background:#fff;z-index:1}
.perf-tbl tr:last-child td{font-weight:700;border-bottom:none;border-top:0.5px solid rgba(0,0,0,.09);background:#f7f5f1}
.perf-tbl tr:last-child td:first-child{background:#f7f5f1}
.perf-tbl .subtotal td{font-weight:600;color:#888;font-size:9px}
/* source panel */
.store-src-panel{padding:12px 16px 14px}
.store-src-inner{background:#f7f5f1;border-radius:10px;padding:12px 14px}
.store-src-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
/* expandable month rows */
.tab3-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;position:sticky;top:125px;z-index:50;background:#f5f4f0;padding:8px 0;margin-top:-8px}
.tab3-pg{display:flex;gap:4px;align-items:center;border-radius:10px;padding:5px 8px;border:0.5px solid}
.tab3-pg.ki{background:rgba(192,64,112,.07);border-color:rgba(192,64,112,.2)}
.tab3-pg.wo{background:rgba(45,90,158,.07);border-color:rgba(45,90,158,.2)}
.tab3-psep{width:0.5px;height:14px;flex-shrink:0}
.tab3-pg.ki .tab3-psep{background:rgba(192,64,112,.2)}
.tab3-pg.wo .tab3-psep{background:rgba(45,90,158,.2)}
.tab3-pill{border:none;background:transparent;font-size:12px;font-weight:400;cursor:pointer;border-radius:6px;padding:4px 9px;display:inline-flex;align-items:center;gap:4px;transition:background .12s;white-space:nowrap}
.tab3-pill.ki{color:#c04070}.tab3-pill.wo{color:#2d5a9e}
.tab3-pill.ki.act{background:rgba(192,64,112,.15);font-weight:500}
.tab3-pill.wo.act{background:rgba(45,90,158,.15);font-weight:500}
.tab3-pdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tab3-pill.ki .tab3-pdot{background:#c04070}.tab3-pill.wo .tab3-pdot{background:#2d5a9e}
.toggle-btn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3px;border:.5px solid rgba(0,0,0,.15);cursor:pointer;font-size:9px;color:#888;margin-right:4px;vertical-align:middle;background:#f0ede8;user-select:none;flex-shrink:0}
.toggle-btn.open{background:#e0dcd5;color:#333}
.exp-row>td{padding:0 !important;border-bottom:.5px solid rgba(0,0,0,.08)}
.exp-inner{background:#f9f8f6;padding:10px 14px 12px 36px;border-top:.5px solid rgba(0,0,0,.05)}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}
.exp-sec-label{font-size:10px;font-weight:500;color:#555;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.exp-src-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:.5px solid rgba(0,0,0,.05);font-size:10px;color:#666}
.exp-src-row:last-child{border-bottom:none}
.exp-src-name{display:flex;align-items:center;gap:5px}
.exp-src-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
@media(max-width:600px){.exp-inner{padding-left:14px}.exp-grid{grid-template-columns:1fr}}
/* responsive */
@media(max-width:600px){
  .store-summary-top{display:block}
  .store-summary-left{margin-bottom:12px}
  .store-summary-metrics{grid-template-columns:repeat(2,1fr)}
  .store-src-grid{grid-template-columns:1fr 1fr}
}
/* ── Brand badge pill ── */
.brand-pill{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.3px}
.bp-ki{background:#fde8f0;color:#c04070}
.bp-wo{background:#e8effe;color:#2d5a9e}
.bp-ec{background:#e8f5e9;color:#2e7d32}
/* ── Section separator ── */
.sec-sep{margin:16px 0 12px;border-top:0.5px dashed rgba(0,0,0,.12);padding-top:14px}
.sec-title{font-size:13px;font-weight:700;color:#1a1a18;margin-bottom:10px}
/* ── Source donut in store card ── */
.src-mini{margin-top:6px}
.src-bar-full{height:6px;border-radius:3px;overflow:hidden;display:flex;margin-bottom:3px}
.src-legend{display:flex;gap:7px;flex-wrap:wrap}
/* ── YOY badge ── */
.yoy{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.yoy-up{background:#e8f5e9;color:#2a7a4a}
.yoy-dn{background:#fce4e4;color:#c0392b}
.yoy-fl{background:#f5f3ee;color:#888780}
/* ── Year table ── */
.ytbl-wrap{overflow-x:auto;border-radius:10px;border:0.5px solid rgba(0,0,0,.09);margin-bottom:20px}
.ytbl{width:100%;border-collapse:collapse;font-size:10.5px;white-space:nowrap}
.ytbl thead tr:first-child th{background:#111;color:#bbb;font-weight:500;font-size:10px;padding:7px 8px;text-align:center;border-right:0.5px solid rgba(255,255,255,.08)}
.ytbl thead tr:first-child th:first-child{text-align:left;min-width:64px}
.ytbl thead tr:last-child th{background:#1e1e1e;color:#888;font-weight:400;font-size:9px;padding:5px 8px;text-align:right;border-right:0.5px solid rgba(255,255,255,.05);border-bottom:0.5px solid rgba(255,255,255,.1)}
.ytbl thead tr:last-child th:first-child{text-align:left}
.ytbl tbody td{padding:5px 8px;border-bottom:0.5px solid rgba(0,0,0,.05);text-align:right;color:#1a1a18;vertical-align:middle}
.ytbl tbody td:first-child{text-align:left;font-weight:600;font-size:10px;position:sticky;left:0;background:#fff;z-index:2;border-right:0.5px solid rgba(0,0,0,.08)}
.ytbl .brow td{background:#f5f3ee;font-size:9px;color:#888780;padding:3px 8px;font-weight:600;letter-spacing:.3px}
.ytbl .brow td:first-child{background:#f5f3ee}
.ytbl tfoot td{font-weight:700;background:#f5f3ee;border-top:0.5px solid rgba(0,0,0,.1);border-bottom:none;font-size:10.5px}
.ytbl tfoot td:first-child{background:#f5f3ee}
.ytbl .yr-sep{border-left:0.5px solid rgba(0,0,0,.08)}
.ach{display:inline-block;font-size:8.5px;font-weight:600;padding:1px 5px;border-radius:3px}
.ach-g{background:#EAF3DE;color:#3B6D11}.ach-b{background:#E6F1FB;color:#185FA5}
.ach-o{background:#FAEEDA;color:#854F0B}.ach-r{background:#FCEBEB;color:#A32D2D}
.txt-up{color:#2a7a4a}.txt-dn{color:#c0392b}.txt-na{color:#aaa}
/* ── Trend cards ── */
.trend-sep{margin:20px 0 12px;padding-top:16px;border-top:0.5px dashed rgba(0,0,0,.1);font-size:11px;font-weight:600;color:#444;letter-spacing:.04em}
.trend-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tcard{background:#fff;border:0.5px solid rgba(0,0,0,.09);border-radius:10px;padding:12px 14px}
.tc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.tc-name{font-size:11px;font-weight:700;color:#1a1a18}
.tc-rev{font-size:17px;font-weight:700;color:#1a1a18;line-height:1;margin-bottom:2px}
.tc-yoy{font-size:10px;margin-bottom:8px}
.chart-wrap{position:relative;height:68px}
.yr-axis{display:flex;justify-content:space-between;margin-top:2px}
.yr-axis span{font-size:8px;color:#888780}

/* ══ 每月業績狀況進度 Tab ══ */
.mo-tabs-wrap{display:flex;gap:4px;margin-bottom:0;background:#f0ede8;padding:4px;border-radius:10px;width:fit-content;position:sticky;top:125px;z-index:50}
.mo-tab-btn{padding:5px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:#888;background:none;border:none;transition:background .12s}
.mo-tab-btn:hover:not(.dim){background:rgba(0,0,0,.05)}
.mo-tab-btn.active{background:#fff;color:#1a1a18;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mo-tab-btn.dim{color:#ccc;cursor:default}
.mo-brand-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mo-bc{border-radius:12px;border:.5px solid var(--border,rgba(0,0,0,.1));background:#fff;overflow:hidden}
.mo-bc.ki{background:rgba(192,64,112,.08);border-color:rgba(192,64,112,.2)}
.mo-bc.wo{background:rgba(45,90,158,.08);border-color:rgba(45,90,158,.2)}
.mo-bc.ki .mo-bc-bar-wrap{background:rgba(192,64,112,.12)}
.mo-bc.wo .mo-bc-bar-wrap{background:rgba(45,90,158,.12)}
.mo-bc.ki .mo-bc-2cell{border-color:rgba(192,64,112,.15)}
.mo-bc.wo .mo-bc-2cell{border-color:rgba(45,90,158,.15)}
.mo-bc-top{display:flex;align-items:center;justify-content:space-between;padding:12px 15px 8px}
.mo-bc-brand{display:flex;align-items:center;gap:7px}
.mo-bc-dot{width:8px;height:8px;border-radius:50%}
.mo-bc-dot.ki{background:#c04070}.mo-bc-dot.wo{background:#2d5a9e}
.mo-bc-name{font-size:13px;font-weight:500;color:#1a1a18}
.mo-bc-chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.mo-bc-chip.r{background:rgba(192,57,43,.1);color:#c0392b}
.mo-bc-chip.g{background:rgba(26,107,60,.1);color:#1a6b3c}
.mo-bc-body{display:flex;align-items:flex-end;justify-content:space-between;padding:0 15px 11px;gap:12px}
.mo-bc-rev{font-size:22px;font-weight:500;color:#1a1a18;letter-spacing:-.02em}
.mo-bc-tgt{font-size:10px;color:#888780;margin-top:3px}
.mo-bc-stats{display:flex;gap:16px}
.mo-bc-stat{text-align:right}
.mo-bc-stat-label{font-size:9px;color:#888780}

/* ══════════════════════════════════════════
   RESPONSIVE — all tabs
   Breakpoints: ≤768px (tablet/phone), ≤480px (phone)
══════════════════════════════════════════ */

/* ── Tablet & phone ── */
@media(max-width:768px){
  body{overflow-x:hidden}

  /* Header: shrink to 60px, hide subtitle */
  .header-inner{padding:0 14px;height:60px;gap:12px}
  .header-title{font-size:14px}
  .header-sub{display:none}
  .logo-svg{width:52px;height:auto}

  /* Nav: adjust sticky top to match 60px header, enable horizontal scroll */
  .nav-bar{top:60px}
  .nav-inner{padding:0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px;flex-wrap:nowrap}
  .nav-inner::-webkit-scrollbar{display:none}
  /* Year filter: sticky to the right edge so it's always visible */
  .nav-filter{position:sticky;right:0;background:#000;padding-left:8px;padding-right:4px;flex-shrink:0;border-left:1px solid rgba(255,255,255,.12);margin-left:4px}

  /* Page padding */
  .page{padding:12px 12px}

  /* ── Tab 1/總覽: KPI + grids ── */
  /* !important needed to override renderKPI() inline style */
  #kpi-strip{grid-template-columns:1fr 1fr !important}
  #kpi-strip > div:nth-child(3){display:none}  /* hide vertical divider */
  .kpi-strip{grid-template-columns:1fr 1fr}
  .stores-2,.stores-3{grid-template-columns:1fr}
  .hch-wrap{grid-template-columns:1fr}
  .trend-grid{grid-template-columns:1fr}

  /* ── Tab 2/每月業績 ── */
  /* sticky tab selector: header 60px + nav 44px = 104px */
  .mo-tabs-wrap{top:104px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%;max-width:100%}
  .mo-tabs-wrap::-webkit-scrollbar{display:none}
  .mo-brand-row{grid-template-columns:1fr}
  .mo-store-grid{grid-template-columns:1fr 1fr}
  .mo-stats-row{grid-template-columns:1fr 1fr}
  .mo-bc-rev{font-size:18px}

  /* ── Tab 3/業績細項 ── */
  .tab3-nav{top:104px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;padding-bottom:4px}
  .tab3-nav::-webkit-scrollbar{display:none}
  /* Store card header */
  .store-hd{padding:12px 12px}
  .store-name-big{font-size:17px}
  .store-rev-big{font-size:18px}
  .store-src-grid{grid-template-columns:1fr 1fr}
  /* perf table font */
  .perf-tbl{font-size:9px}
  .perf-tbl th,.perf-tbl td{padding:4px 6px}

  /* ── Tab 6/諮詢師 ── */
  .cs-top-bar{top:104px;gap:6px}
  .cs-brand-row{grid-template-columns:1fr}
  .cs-store-grid{grid-template-columns:1fr}
  .cs-brand-stats{grid-template-columns:repeat(4,1fr)} /* keep 4, let it shrink */
  .cs-total-bar{grid-template-columns:1fr 1fr}
}

/* ── Phone only ── */
@media(max-width:480px){
  /* Header */
  .header-inner{padding:0 10px;height:52px}
  .nav-bar{top:52px}
  .tab3-nav,.mo-tabs-wrap,.cs-top-bar{top:96px}
  .header-divider{display:none}
  .logo-svg{width:44px}

  /* Nav: tighter */
  .nav-item{font-size:11px;padding:4px 9px}

  /* Page */
  .page{padding:8px 8px}

  /* KPI */
  .kpi-value{font-size:18px}
  .kpi-card{padding:10px 12px}

  /* Hist chart */
  .hch-chart{height:90px}
  .hch-panel{padding:10px 10px 8px}

  /* Trend cards: 1 column on phone */
  .trend-grid{grid-template-columns:1fr}

  /* Tab 2 brand cards */
  .mo-store-grid{grid-template-columns:1fr}
  .mo-bc-body{flex-direction:column;align-items:flex-start;gap:8px}
  .mo-bc-stats{flex-wrap:wrap;gap:12px}
  .mo-bc-stat-val{font-size:11px}
  .mo-group-card{padding:14px 14px}
  .mo-group-rev{font-size:24px}
  .mo-group-ach{font-size:16px}

  /* Tab 3 pills: tighter */
  .tab3-pg{padding:4px 6px}
  .tab3-pill{font-size:11px;padding:3px 7px}
  /* Store header metrics: 2×2 already done, but also tweak font */
  .store-met-v{font-size:12px}
  .store-src-inner{padding:10px 10px}
  /* Perf table tighter */
  .perf-tbl{font-size:8.5px}
  .perf-tbl th,.perf-tbl td{padding:4px 4px}

  /* Tab 6 consultant */
  .cs-store-grid{grid-template-columns:1fr}
  .cs-brand-stats{grid-template-columns:1fr 1fr}
  .cs-total-bar{grid-template-columns:1fr 1fr}
  .cs-c-row{flex-wrap:wrap;gap:6px}
  .cs-c-stats{flex-wrap:wrap}
  .cs-cs{min-width:25%}
  .cs-top-bar{flex-wrap:wrap}
  .cs-trend-btn{margin-left:0}
}

};

// Brand totals — recalculated after each data load
let KI_TOTAL_REV=0, WO_TOTAL_REV=0, KI_TARGET_H1=0, WO_TARGET_H1=0, TOTAL_REV=0, TOTAL_TARGET=0;
let KI_TARGET_YR=0, WO_TARGET_YR=0, TOTAL_TARGET_YR=0;
function recalcTotals(){
  KI_TOTAL_REV = KI_STORES.reduce((s,k)=>s+DATA[k].revenue,0);
  WO_TOTAL_REV = WO_STORES.reduce((s,k)=>s+DATA[k].revenue,0);
  KI_TARGET_H1 = KI_STORES.reduce((s,k)=>s+DATA[k].target_h1,0);
  WO_TARGET_H1 = WO_STORES.reduce((s,k)=>s+DATA[k].target_h1,0);
  TOTAL_REV    = KI_TOTAL_REV + WO_TOTAL_REV;
  TOTAL_TARGET = KI_TARGET_H1 + WO_TARGET_H1;
  // Full-year annual targets — paired stores counted once via isFirst
  const _allKeys=[...KI_STORES,...WO_STORES];
  TOTAL_TARGET_YR = _allKeys.reduce((s,k)=>{
    const pair=PAIRED_STORES[k];
    if(pair && !pair.isFirst) return s;           // skip: shared target already added by partner
    if(pair)  return s+(pair.sharedTgt[2026]||0); // count shared target once
    return s+(TARGET_2026[k]||0);                 // individual annual target
  },0);
  // Brand-level annual targets (fixed per management plan)
  KI_TARGET_YR = 118600000;
  WO_TARGET_YR = 100100000;
  TOTAL_TARGET_YR = 218700000;
}

function fmtM(n){return n?'$'+Math.round(n).toLocaleString():'$0'}
function fmtK(n){return n>=1000?'$'+(n/1000).toFixed(0)+'K':'$'+Math.round(n)}
function fmtFull(n){return n?'$'+Math.round(n).toLocaleString():null}
function fmtN(n){return n.toLocaleString()}
function fmtPct(p){return Math.round(p*100)+'%'}
function pctColor(p){return p>=1?'#2a7a4a':p>=0.8?'#5b8dee':p>=0.7?'#f0a030':'#e27575'}
function pctTextColor(p){return p>=1?'#2a7a4a':'#c0392b'}
function achieveBadge(p){
  if(p>=1) return ['badge-g','達標'];
  return ['badge-r','落後'];
}
function monthBarColor(p){
  if(p===null) return '#ddd';
  if(p>=1) return '#2a7a4a';
  if(p>=0.8) return '#5b8dee';
  if(p>=0.7) return '#f0a030';
  return '#e27575';
}
function yoyBadge(y){
  if(y===null) return '<span class="yoy yoy-fl">新開店</span>';
  const cls = y>0?'yoy-up':y<0?'yoy-dn':'yoy-fl';
  return `<span class="yoy ${cls}">${Math.round(y*100)}%</span>`;
}

// ══════════════════════════════════════════
//  HIST CHART (歷年三欄柱狀圖)
// ══════════════════════════════════════════
function renderHistChart(){
  const el=document.getElementById('hist-chart-wrap');
  if(!el) return;
  // Collect sorted historical years
  const yrSet=new Set();
  Object.values(HIST_DATA).forEach(arr=>arr.forEach(e=>yrSet.add(e.yr)));
  const histYrs=Array.from(yrSet).sort((a,b)=>a-b);
  const allKeys=[...KI_STORES,...WO_STORES];
  // Sum revenue by brand+year
  function sumYr(keys,yr){
    return keys.reduce((s,k)=>{
      const e=(HIST_DATA[k]||[]).find(d=>d.yr===yr);
      return s+(e?e.rev:0);
    },0);
  }
  // 2026 H1 from live DATA
  const ki26=KI_STORES.reduce((s,k)=>s+DATA[k].revenue,0);
  const wo26=WO_STORES.reduce((s,k)=>s+DATA[k].revenue,0);
  const tot26=ki26+wo26;
  const allYrs=[...histYrs,2026];
  const kiS=[...histYrs.map(y=>sumYr(KI_STORES,y)),ki26];
  const woS=[...histYrs.map(y=>sumYr(WO_STORES,y)),wo26];
  const totS=[...histYrs.map(y=>sumYr(allKeys,y)),tot26];
  const CHART_H=130;
  function mkH(series){const mx=Math.max(...series);return series.map(v=>mx>0?Math.round(v/mx*CHART_H):0);}
  const kiH=mkH(kiS),woH=mkH(woS),totH=mkH(totS);
  function fv(v){
    if(v>=100000000) return(v/100000000).toFixed(2).replace(/\.?0+$/,'')+'億';
    return Math.round(v/10000).toLocaleString()+'萬';
  }
  function fvTgt(v){ return Math.round(v/10000).toLocaleString()+'萬'; }
  function yoyBadge(series,i){
    const last=i===allYrs.length-1;
    if(last) return'<span class="hch-yoy hch-na">H1</span>';
    if(i===0) return'<span class="hch-yoy hch-na">—</span>';
    const r=(series[i]-series[i-1])/series[i-1];
    const cls=r>0?'hch-up':'hch-dn';
    return`<span class="hch-yoy ${cls}">${r>0?'+':''}${Math.round(r*100)}%</span>`;
  }
  // 集團年度目標（2026 為全年目標 2.225億 之 H1 比例）
  const GROUP_TARGETS={2024:167000000,2025:210730000,2026:218700000};  // 各年門市目標加總
  // 線上通路業績（不計入目標，疊加在集團 bar 上）
  const ONLINE_DATA={2022:4428458,2023:2004352,2024:1045037,2025:448103};
  const online26H1=125173;
  const onlineS=[...histYrs.map(y=>ONLINE_DATA[y]||0),online26H1];
  function panel(name,color,nameClr,borderClr,series,heights,tgtArr,onlineSeries){
    // If online series provided, scale bars by total (store+online)
    const totalSeries=onlineSeries?series.map((v,i)=>v+(onlineSeries[i]||0)):series;
    // mx 納入年度目標，確保全年目標 bar 不超出圖表
    const tgtMax=tgtArr?Math.max(0,...tgtArr.filter(t=>t!=null)):0;
    const mx=Math.max(...totalSeries,tgtMax);
    const hasTgt=tgtArr&&tgtArr.some(t=>t!=null);
    const bars=allYrs.map((yr,i)=>{
      const ytd=i===allYrs.length-1;
      const onlineV=onlineSeries?(onlineSeries[i]||0):0;
      const storeH=mx>0?Math.round(series[i]/mx*CHART_H):0;
      const onlineH=mx>0?Math.round(onlineV/mx*CHART_H):0;
      // 剩餘目標：ytd 欄顯示（年度目標 − H1 實績）的條紋段
      const lastTgtV=tgtArr?tgtArr[allYrs.length-1]:null;
      const h2H=ytd&&lastTgtV&&lastTgtV>series[i]?Math.max(0,Math.round((lastTgtV-series[i])/mx*CHART_H)):0;
      const hasAbove=onlineH>0||h2H>0;
      const lbl=`<div class="hch-bv${ytd?' hch-ytd-lbl':''}">${fv(series[i])}${ytd?'<br>H1':''}</div>`;
      const onlineDiv=onlineH>0?`<div style="height:${onlineH}px;background:#c8a84b;border-radius:${h2H>0?'0':'3px 3px 0 0'};width:100%;flex-shrink:0"></div>`:'';
      const h2Div=h2H>0?`<div style="height:${h2H}px;background:repeating-linear-gradient(45deg,${color} 0,${color} 1.5px,transparent 1.5px,transparent 5px);opacity:.45;width:100%;flex-shrink:0;border:.5px dashed ${color};box-sizing:border-box;border-radius:${onlineH>0?'0':'3px 3px 0 0'}"></div>`:'';
      const storeDiv=`<div class="hch-bar${ytd?' hch-ytd':''}" style="height:${storeH}px;background:${color};${hasAbove?'border-radius:0;':''}${ytd&&!hasAbove?`border-top:2px dashed ${color};`:''}"></div>`;
      return`<div class="hch-bw">${lbl}${onlineDiv}${h2Div}${storeDiv}</div>`;
    }).join('');
    // SVG target dashed line overlay
    let svgOvl='';
    if(hasTgt&&mx>0){
      const svgPts=allYrs.map((yr,i)=>{
        if(tgtArr[i]==null) return null;
        const cx=((i+0.5)/allYrs.length*100).toFixed(2);
        const barTopCy=(1-series[i]/mx)*100;
        const tgtCy=(1-tgtArr[i]/mx)*100;
        // 實際>=目標時，確保虛線至少在 bar 頂下方 8 SVG-unit（≈10px，避免視覺上超出）
        const cy=series[i]>=tgtArr[i]?Math.max(tgtCy,barTopCy+8):tgtCy;
        return`${cx},${cy.toFixed(2)}`;
      }).filter(Boolean);
      if(svgPts.length>1){
        svgOvl=`<svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none" viewBox="0 0 100 100" preserveAspectRatio="none">
          <polyline points="${svgPts.join(' ')}" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" fill="none" vector-effect="non-scaling-stroke"/>
        </svg>`;
      }
    }
    // Target YOY badge
    function tgtYoy(i){
      const last=i===allYrs.length-1;
      const cur=tgtArr[i];
      if(cur==null) return '';
      if(last) return'<span class="hch-yoy hch-na">—</span>';
      const prev=i>0?tgtArr[i-1]:null;
      if(prev==null) return'<span class="hch-yoy hch-na">—</span>';
      const r=(cur-prev)/prev;
      return`<span class="hch-yoy ${r>0?'hch-up':'hch-dn'}">${r>0?'+':''}${Math.round(r*100)}%</span>`;
    }
    // X-axis label area — grid layout when targets present (guarantees row alignment)
    const n=allYrs.length;
    let xlHtml;
    if(hasTgt){
      const rYr =allYrs.map((yr,i)=>`<div style="text-align:center"><span class="hch-xn${i===n-1?' hch-cur':''}">${yr}</span></div>`).join('');
      const rYoy=allYrs.map((_,i)=>`<div style="text-align:center">${yoyBadge(series,i)}</div>`).join('');
      const rTgt=allYrs.map((_,i)=>`<div style="text-align:center"><span class="hch-tgt-v">${tgtArr[i]!=null?fvTgt(tgtArr[i]):''}</span></div>`).join('');
      xlHtml=`<div style="display:grid;grid-template-columns:auto repeat(${n},1fr);column-gap:3px;row-gap:0;margin-top:5px;align-items:center">
        <div></div>${rYr}
        <div></div>${rYoy}
        <div style="grid-column:1/-1;border-top:.5px dashed rgba(0,0,0,.08);margin:3px 0 2px"></div>
        <div class="hch-xi-lbl-t" style="text-align:right;padding-right:4px">目標</div>${rTgt}
      </div>`;
    } else {
      const xlbls=allYrs.map((yr,i)=>`<div class="hch-xi">
        <span class="hch-xn${i===n-1?' hch-cur':''}">${yr}</span>
        ${yoyBadge(series,i)}
      </div>`).join('');
      xlHtml=`<div class="hch-xl">${xlbls}</div>`;
    }
    const tot5=series.slice(0,-1).reduce((a,b)=>a+b,0);
    const last=series[series.length-2];
    // 全年進度列
    const lastTgt=tgtArr?tgtArr[allYrs.length-1]:null;
    const fullYrTgt=lastTgt||null;
    const h1Rev=series[allYrs.length-1];
    let progHtml='';
    if(fullYrTgt){
      const h1Pct=Math.min(100,Math.round(h1Rev/fullYrTgt*100));
      progHtml=`<div style="margin-top:8px;padding-top:8px;border-top:.5px solid rgba(0,0,0,.07)">
        <div style="font-size:7.5px;color:#aaa;margin-bottom:2px">H1 目標達成進度</div>
        <div style="height:4px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden;margin:3px 0;position:relative">
          <div style="position:absolute;left:0;top:0;width:${h1Pct}%;height:100%;background:${color}"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:8px;color:#aaa;margin-top:2px">
          <span>H1 實績 <b style="color:#555">${fv(h1Rev)}</b></span>
          <span>年度目標 <b style="color:#555">${fvTgt(fullYrTgt)}</b></span>
          <span><b style="color:#555">${h1Pct}%</b> 達成率</span>
        </div>
      </div>`;
    }
    return`<div class="hch-panel" style="border-color:${borderClr}">
      <div class="hch-ph">
        <div class="hch-pd" style="background:${color}"></div>
        <span class="hch-pn" style="color:${nameClr}">${name}</span>
        <span class="hch-pt">億元</span>
      </div>
      <div class="hch-chart">
        <div class="hch-yl" style="bottom:75%"></div>
        <div class="hch-yl" style="bottom:50%"></div>
        <div class="hch-yl" style="bottom:25%"></div>
        ${bars}
        ${svgOvl}
      </div>
      ${xlHtml}
      ${progHtml}
      <div class="hch-sum">
        <div class="hch-sum-item"><div class="hch-sv">${fv(tot5)}</div><div class="hch-sl">${histYrs[0]}–${histYrs[histYrs.length-1]} 累計</div></div>
        <div class="hch-sum-item"><div class="hch-sv">${fv(last)}</div><div class="hch-sl">${histYrs[histYrs.length-1]} 全年</div></div>
      </div>
    </div>`;
  }
  const WO_TARGETS={2026:100100000};   // 全年目標
  const KI_TARGETS={2026:118600000};   // 全年目標
  const totTgt=allYrs.map(yr=>GROUP_TARGETS[yr]||null);
  const woTgt=allYrs.map(yr=>WO_TARGETS[yr]||null);
  const kiTgt=allYrs.map(yr=>KI_TARGETS[yr]||null);
  el.innerHTML=`<div class="hch-wrap">
    ${panel('集團總計','#888780','#1a1a18','rgba(0,0,0,.09)',totS,totH,totTgt,onlineS)}
    ${panel('原渥','#2d5a9e','#1a3a6e','rgba(45,90,158,.25)',woS,woH,woTgt)}
    ${panel('原綺','#c04070','#8c2044','rgba(192,64,112,.25)',kiS,kiH,kiTgt)}
  </div>
  <div class="hch-note">2026 為 H1 實績（1–6月）；斜線條紋為距全年目標之剩餘缺口（目標 − H1 實績）。虛線為年度目標（集團 2,225萬、原渥 1,001萬、原綺 1,186萬）。2021–2022 原渥僅含站前/大安/忠孝 3 店。<br>集團灰色 = 門市業績；<span style="display:inline-block;width:8px;height:8px;background:#c8a84b;border-radius:1px;vertical-align:middle;margin:0 2px"></span> 黃色 = 線上通路（不計入目標，2022 起）。</div>`;
}

function renderStoreCard(s){
  const [badgeClass, badgeText] = achieveBadge(s.achieve_h1);
  const pct_bar = Math.min(s.achieve_h1,1)*100;
  const bar_color = pctColor(s.achieve_h1);
  const new_pct = s.revenue>0?(s.new_rev/s.revenue*100).toFixed(0):0;
  const old_pct = 100-new_pct;
  const gap = s.target_h1-s.revenue;
  const total_count = s.new_count + s.old_count;

  // Monthly bars
  const monthBars = s.months.map(m=>{
    const h = m.achieve===null ? 0 : Math.min(m.achieve,1.5)/1.5*100;
    const color = monthBarColor(m.achieve);
    const pctText = m.achieve===null ? (m.rev>0?'—':'—') : fmtPct(m.achieve);
    const pctColor2 = m.achieve===null?'#bbb':pctTextColor(m.achieve);
    return `<div class="mc">
      <div class="mc-wrap"><div class="mc-bar" style="height:${h}%;background:${color}"></div></div>
      <div class="mc-pct" style="color:${pctColor2}">${pctText}</div>
      <div class="mc-lbl">${m.m}</div>
    </div>`;
  }).join('');

  return `<div class="sc">
    <div class="sc-head">
      <div>
        <div class="sc-name">${s.label}</div>
        <div class="sc-sub">H1目標 ${fmtM(s.target_h1)}</div>
      </div>
      <span class="sc-badge ${badgeClass}">${badgeText} ${fmtPct(s.achieve_h1)}</span>

function renderSrcBar(brandKey){
  const src = BRAND_SOURCES[brandKey];
  const total = Object.values(src).reduce((a,b)=>a+b,0);
  const colors = {行銷:'#5b8dee',業務:'#e27575',團購:'#f0a030',其他:'#5bbf8a'};
  const bars = Object.entries(src).map(([k,v])=>
    `<div style="width:${(v/total*100).toFixed(1)}%;background:${colors[k]}"></div>`
  ).join('');
  const legend = Object.entries(src).map(([k,v])=>
    `<div class="src-item"><div class="src-dot" style="background:${colors[k]}"></div>${k} ${(v/total*100).toFixed(0)}%（${v}人）</div>`
  ).join('');
  return `<div class="src-mini">
    <div class="src-bar-full">${bars}</div>
    <div class="src-legend">${legend}</div>
  </div>`;
}

// ══════════════════════════════════════════
//  YEAR TABLE HELPERS
// ══════════════════════════════════════════
function achChip(r,t){
  if(!t||!r) return '—';
  const p=r/t;
  const cls=p>=1?'ach-g':'ach-r';
  return `<span class="ach ${cls}">${Math.round(p*100)}%</span>`;
}
function yoyTxt(cur,prev){
  if(!prev||!cur) return '<span class="txt-na">—</span>';
  const d=(cur-prev)/prev;
  const cls=d>0?'txt-up':d<0?'txt-dn':'txt-na';
  return `<span class="${cls}">${Math.round(d*100)}%</span>`;
}
function revCell(v){ return v?fmtFull(v):'<span style="color:#ccc">—</span>'; }
function tgtCell(v){ return v?`<span style="color:#aaa">${fmtFull(v)}</span>`:'<span style="color:#ddd">—</span>'; }

let _trendCharts=[];
function renderTab1(){
  // destroy old charts
  _trendCharts.forEach(c=>{try{c.destroy()}catch(e){}});

  // Build lookup: storeKey -> {yr -> {rev,target}}
  function histMap(key){
    const m={};
    (HIST_DATA[key]||[]).forEach(d=>{ m[d.yr]={rev:d.rev,target:d.target||null}; });

  }

  // Year table row for one store

      } else if(yr===2024){
        cells+=`<td class="yr-sep">${revCell(rev)}</td><td>${tgtCell(tgt)}</td><td>${achChip(rev,tgt)}</td><td>${yoyTxt(rev,prevRev)}</td>`;
      } else {
        // yr===2025 — shared target for paired stores
        if(pair && pair.isFirst){

          cells+=`<td>${yoyTxt(rev,prevRev)}</td>`;
        } else {

  function totalRow(){

    let prevRev=null;

      const rev=allKeys.reduce((s,k)=>{const d=histMap(k)[yr];return s+(d?d.rev:0);},0)||null;
      const tgt=allKeys.reduce((s,k)=>{const d=histMap(k)[yr];return s+(d&&d.target?d.target:0);},0)||null;

      } else if(yr===2023){
        cells+=`<td class="yr-sep">${revCell(rev)}</td><td>${yoyTxt(rev,prevRev)}</td>`;

            <th colspan="4" style="border-left:0.5px solid rgba(255,255,255,.12)">2025</th>
            <th colspan="4" style="border-left:0.5px solid rgba(255,255,255,.12);color:#7ab3ff">2026 H1</th>
          </tr>
          <tr>
            <th class="yr-sep">業績</th>
            <th class="yr-sep">業績</th><th>YOY</th>
            <th class="yr-sep">業績</th><th>YOY</th>
            <th class="yr-sep">業績</th><th>目標</th><th>達成</th><th>YOY</th>
            <th class="yr-sep">業績</th><th>目標</th><th>達成</th><th>YOY</th>
            <th class="yr-sep" style="color:#7ab3ff">業績</th><th>年目標</th><th>達成</th><th>YOY</th>
          </tr>
        </thead>
        <tbody>

        <tfoot>${totalRow()}</tfoot>

    // add 2026 H1

    const ctx=document.getElementById('tc'+idx);
    if(!ctx) return;
    const chart=new Chart(ctx,{
      type:'line',

          {label:'業績',data:revData,borderColor:lineBlue,borderWidth:2,pointRadius:3,pointBackgroundColor:lineBlue,pointBorderWidth:0,fill:true,backgroundColor:lineFill,tension:0.3,spanGaps:false},

  if(active) active.classList.add('act');

  if(key==='ki_all'){
    kiSec.style.display=''; woSec.style.display='none';

  const srcTotal = Object.values(src).reduce((a,b)=>a+b,0);
  const srcLabel = s.new_src ? (s.new_src._label||'H1累計') : '品牌整體';
  const srcTitle = `新客來源分析（${srcLabel}）`;
  const brandClr = s.brandKey==='wo' ? '#2d5a9e' : '#c04070';
  const brandMid = s.brandKey==='wo' ? '#6b8ec0' : '#d47098';
  const brandLt  = s.brandKey==='wo' ? '#9ab2d5' : '#e5a0bc';
  const colors = {行銷:brandClr, 業務:brandMid, 團購:brandLt, 其他:'#b0ada5'};
  const newColor = brandClr;
  const oldColor = s.brandKey==='wo' ? 'rgba(45,90,158,0.25)' : 'rgba(192,64,112,0.25)';

  const srcBars = Object.entries(src).map(([k,v])=>
    `<div style="width:${(v/srcTotal*100).toFixed(1)}%;background:${colors[k]}"></div>`
  ).join('');
  const srcLegend = Object.entries(src).map(([k,v])=>
    `<div style="display:flex;align-items:center;font-size:11px;"><div style="width:7px;height:7px;border-radius:50%;background:${colors[k]};margin-right:5px;flex-shrink:0"></div>${k} ${v}人 <span style="margin-left:auto;font-weight:500;color:${colors[k]}">${srcTotal>0?(v/srcTotal*100).toFixed(0):0}%</span></div>`
  ).join('');

  const TGT_CELL = 'background:#f5f3ee;border-left:0.5px solid #dbd8d0';

  // ── YoY helper ──────────────────────────────────────
  const lyMo = (typeof LY_MONTHLY!=='undefined' && LY_MONTHLY[storeKey]) || null;
  function mkLyCell(cur, lyVal, isCount=false){
    const curStr = isCount ? (cur||'—') : fmtM(cur);
    if(!lyMo || lyVal==null || lyVal===0) return curStr;
    const pct = lyVal>0 ? (cur-lyVal)/lyVal : null;
    const lyStr = isCount ? lyVal : fmtM(lyVal);
    const pctClr = pct===null ? '#aaa' : pct>=0 ? '#2a7a4a' : '#c0392b';
    const pctStr = pct!==null ? `<div style="font-size:9px;font-weight:600;color:${pctClr};line-height:1.2">${pct>=0?'+':''}${Math.round(pct*100)}%</div>` : '';
    return `<div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.4">
      <div>${curStr}</div>
      <div style="font-size:9px;color:#ccc;line-height:1.2">${lyStr}</div>
      ${pctStr}
    </div>`;
  }
  // Compute LY YTD (sum months up to latest month with data)
  let lyYTD = null;
  if(lyMo){
    let lastMoIdx = 0;
    s.months.forEach((m,i)=>{ if(m.rev>0||m.new_n>0) lastMoIdx=i; });
    lyYTD={rev:0,new_rev:0,old_rev:0,new_n:0,old_n:0};
    for(let i=0;i<=lastMoIdx;i++){
      lyYTD.rev     += lyMo[i]?.rev||0;
      lyYTD.new_rev += lyMo[i]?.new_rev||0;
      lyYTD.old_rev += lyMo[i]?.old_rev||0;
      lyYTD.new_n   += lyMo[i]?.new_n||0;
      lyYTD.old_n   += lyMo[i]?.old_n||0;
    }
  }
  // ────────────────────────────────────────────────────

  const monthRows = s.months.map((m,idx)=>{
    const isEmpty = m.rev===0 && m.new_n===0;
    if(isEmpty && idx>=6) return '';  // H2 無資料直接隱藏
    if(isEmpty) return `<tr>
      <td>${m.m}</td>
      <td colspan="7" style="color:#ccc;font-size:9px;text-align:center">— 尚未累完 —</td>
    </tr>`;
    // Priority: m.tgt (from sync) → monthly_tgt[idx] (hardcoded)
    const tgt = m.tgt||(s.monthly_tgt?s.monthly_tgt[idx]:null)||null;
    const achStr = m.achieve!==null ? `<span style="color:${pctTextColor(m.achieve)}">${fmtPct(m.achieve)}</span>` : '—';
    const snap = (typeof MO_SNAP_DATA!=='undefined'&&MO_SNAP_DATA[idx]&&storeKey)?MO_SNAP_DATA[idx][storeKey]:null;
    const hasSrc = snap&&(snap.src_new||snap.src_old);
    const expId = `exp_${storeKey}_${idx}`;
    const srcColors = colors;
    function srcRows(obj, total){
      if(!obj) return '<div style="font-size:10px;color:#aaa">無資料</div>';
      return Object.entries(obj).map(([k,v])=>`
        <div class="exp-src-row">
          <span class="exp-src-name"><span class="exp-src-dot" style="background:${srcColors[k]}"></span>${k}</span>
          <span><span style="font-weight:500;color:#1a1a18">${v}人</span><span style="font-size:9px;color:#aaa;margin-left:4px">${total>0?Math.round(v/total*100):0}%</span></span>
        </div>`).join('');
    }
    const expRow = hasSrc ? `
    <tr id="${expId}" class="exp-row" style="display:none">
      <td colspan="8"><div class="exp-inner"><div class="exp-grid">
        <div>
          <div class="exp-sec-label"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${brandClr}"></span>新客來源（${snap.new_n||0}人）</div>
          ${srcRows(snap.src_new, snap.new_n)}
        </div>
        <div>
          <div class="exp-sec-label"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${brandMid}"></span>舊客來源（${snap.old_n||0}人）</div>
          ${srcRows(snap.src_old, snap.old_n)}
        </div>
      </div></div></td>
    </tr>` : '';
    const toggleBtn = hasSrc ? `<span class="toggle-btn" onclick="toggleMonthRow(this,'${expId}')">+</span>` : `<span style="display:inline-block;width:19px"></span>`;
    const ly = lyMo ? lyMo[idx] : null;
    return `<tr>
      <td>${toggleBtn}${m.m}</td>
      <td>${mkLyCell(m.new_rev, ly?.new_rev)}</td><td>${mkLyCell(m.new_n, ly?.new_n, true)}</td>
      <td>${mkLyCell(m.old_rev, ly?.old_rev)}</td><td>${mkLyCell(m.old_n, ly?.old_n, true)}</td>
      <td>${mkLyCell(m.rev, ly?.rev)}</td>
      <td style="${TGT_CELL}">${tgt?fmtM(tgt):'—'}</td>
      <td>${achStr}</td>
    </tr>${expRow}`;
  }).filter(Boolean).join('');

  const new_pct_total = s.revenue>0?Math.round(s.new_rev/s.revenue*100):0;

  const new_avg = s.new_count>0?fmtM(Math.round(s.new_rev/s.new_count)):'—';
  const old_avg = s.old_count>0?fmtM(Math.round(s.old_rev/s.old_count)):'—';

  return `<div class="store-tbl-card">

    <!-- header + H1 summary -->
    <div class="store-hd">
      <div class="store-hd-name">
        <span class="brand-pill ${s.brandKey==='ki'?'bp-ki':'bp-wo'}">${s.brand}</span>
        <span class="store-name-big">${s.label}</span>
        <span class="sc-badge ${badgeClass}" style="font-size:9px;padding:2px 8px;border-radius:12px;font-weight:600">${badgeText} ${fmtPct(s.achieve_h1)}</span>
        ${yoyBadge(s.yoy_h1)}
      </div>
      <div class="store-summary-top">
        <div class="store-summary-left">
          <div style="font-size:10px;color:#aaa">H1 累計</div>
          <div class="store-rev-big">${fmtM(s.revenue)} <span style="font-size:14px;font-weight:500;color:${pctTextColor(s.achieve_h1)}">${fmtPct(s.achieve_h1)}</span></div>
          <div style="font-size:10px;color:#aaa">目標 ${s.target_h1?fmtM(s.target_h1):'—'}</div>
        </div>
        <div>
          <div style="height:6px;border-radius:3px;overflow:hidden;display:flex;gap:1px;margin-bottom:5px">
            <div style="flex:${new_pct_total};background:${newColor}"></div>
            <div style="flex:${100-new_pct_total};background:${oldColor}"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:10px;color:#aaa">
            <span>● 新客 ${new_pct_total}%　${fmtM(s.new_rev)}</span>
            <span>舊客 ${100-new_pct_total}%　${fmtM(s.old_rev)} ●</span>
          </div>
          <div class="store-summary-metrics">
            <div class="store-met"><div class="store-met-v">${fmtN(s.new_count)}</div><div class="store-met-l">新客數</div></div>
            <div class="store-met"><div class="store-met-v">${new_avg}</div><div class="store-met-l">新客客單</div></div>
            <div class="store-met"><div class="store-met-v">${fmtN(s.old_count)}</div><div class="store-met-l">舊客數</div></div>
            <div class="store-met"><div class="store-met-v">${old_avg}</div><div class="store-met-l">舊客客單</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- table with sticky month col -->
    <div class="tbl-scroll">
      <table class="perf-tbl">
        <tr>
          <th>月份</th>
          <th>新客業績</th><th>新客數</th>
          <th>舊客業績</th><th>舊客數</th>
          <th>總業績</th>
          <th style="background:#f5f3ee;color:#6b6860;border-left:0.5px solid #dbd8d0;font-weight:600">當月目標</th>
          <th>達成率</th>
        </tr>
        ${monthRows}
        <tr>
          <td>合計</td>
          <td>${mkLyCell(s.new_rev, lyYTD?.new_rev)}</td><td>${mkLyCell(s.new_count, lyYTD?.new_n, true)}</td>
          <td>${mkLyCell(s.old_rev, lyYTD?.old_rev)}</td><td>${mkLyCell(s.old_count, lyYTD?.old_n, true)}</td>
          <td>${mkLyCell(s.revenue, lyYTD?.rev)}</td>
          <td style="${TGT_CELL}">${s.target_h1?fmtM(s.target_h1):'—'}</td>
          <td><span style="color:${pctTextColor(s.achieve_h1)}">${fmtPct(s.achieve_h1)}</span></td>
        </tr>
      </table>
    </div>

    <!-- source analysis -->
    <div class="store-src-panel">
      <div class="store-src-inner">
        <div style="font-size:10px;color:#aaa;margin-bottom:8px">${srcTitle}</div>
        <div style="height:7px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:10px">${srcBars}</div>
        <div class="store-src-grid">${srcLegend}</div>
      </div>
    </div>

  </div>`;
}

//  MONTHLY SNAP DATA
// ══════════════════════════════════════════
let MO_SNAP_DATA=[];   // index 0=1月, 1=2月, …
let LY_MONTHLY={};    // 2025 monthly per-store: {storeKey:[{rev,new_rev,old_rev,new_n,old_n}×12]}
let _curMoTab=0;
let _wrMoIdx = new Date().getMonth();

function parseMoSheet(gd){
  const rows=gd.table.rows||[];
  const result={};
  let brand=null;
  for(let ri=0;ri<rows.length;ri++){
    const r=rows[ri];
    const c1=String(cv(r,1)||'').trim();
    const c3=String(cv(r,3)||'').trim();
    if(c1==='原綺'){brand='ki';continue;}
    if(c1==='原渥'){brand='wo';continue;}
    if(!brand) continue;
    if(c3!=='人數') continue;
    let key=null;
    if(c1==='台北') key='ki_taipei';
    else if(c1==='台中'&&brand==='ki') key='ki_taichung';
    else if(c1==='站前') key='wo_zhanqian';
    else if(c1==='大安') key='wo_daan';
    else if(c1==='忠孝') key='wo_zhongxiao';
    else if(c1==='東門') key='wo_dongmen';
    else if(c1==='台中'&&brand==='wo') key='wo_taichung';
    else if(c1==='板橋') key='wo_banqiao';
    if(!key) continue;
    const new_n=toN(cv(r,5)), old_n=toN(cv(r,6));
    const src_new={行銷:toN(cv(r,7)),業務:toN(cv(r,8)),團購:toN(cv(r,9)),其他:toN(cv(r,10))};
    const src_old={行銷:toN(cv(r,11)),業務:toN(cv(r,12)),團購:toN(cv(r,13)),其他:toN(cv(r,14))};
    const r2=rows[ri+1]||null;
    const target=r2?Math.abs(toN(cv(r2,2))):0;
    const total_rev=r2?toN(cv(r2,4)):0, new_rev=r2?toN(cv(r2,5)):0, old_rev=r2?toN(cv(r2,6)):0;
    const r3=rows[ri+2]||null;
    const achStr=r3?String(cv(r3,2)||'').replace('%',''):'';
    const achieve=achStr?parseFloat(achStr)/100:null;
    const new_avg=r3?Math.abs(toN(cv(r3,5))):0, old_avg=r3?Math.abs(toN(cv(r3,6))):0;
    result[key]={new_n,old_n,src_new,src_old,target,total_rev,new_rev,old_rev,achieve,new_avg,old_avg};
  }
  return result;
}

//  H1 MATRIX (top of monthly tab)
// ══════════════════════════════════════════
function renderH1Matrix(){
  const MOS=['1月','2月','3月','4月','5月','6月'];
  function chip(p){
    if(p===null) return '<span class="mch mch-na">—</span>';
    return`<span class="mch ${p>=1?'mch-g':'mch-r'}">${Math.round(p*100)}%</span>`;
  }
  function moCell(key,i){
    const m=DATA[key].months[i];
    if(!m||m.rev===0) return`<td>${chip(null)}</td>`;
    return`<td>${chip(m.achieve)}<div class="mch-rev">${fmtM(m.rev)}</div></td>`;
  }
  function totalCell(key){
    const s=DATA[key];
    return`<td>${chip(s.achieve_h1)}<div class="mch-rev">${fmtM(s.revenue)}</div></td>`;
  }
  function brandMoCell(keys,i){
    let rev=0,tgt=0;
    keys.forEach(k=>{
      const m=DATA[k].months[i]; if(!m) return;
      rev+=m.rev||0;
      tgt+=(m.tgt||(DATA[k].monthly_tgt?DATA[k].monthly_tgt[i]:0)||0);
    });
    if(!rev) return`<td>${chip(null)}</td>`;
    return`<td>${chip(tgt>0?rev/tgt:null)}<div class="mch-rev">${fmtM(rev)}</div></td>`;
  }
  function brandTotCell(keys){
    let rev=0,tgt=0;
    keys.forEach(k=>{rev+=DATA[k].revenue;tgt+=DATA[k].target_h1;});
    return`<td>${chip(tgt>0?rev/tgt:null)}<div class="mch-rev">${fmtM(rev)}</div></td>`;
  }
  function storeRow(key){
    return`<tr>
      <td>${DATA[key].label}</td>
      ${MOS.map((_,i)=>moCell(key,i)).join('')}
      ${totalCell(key)}
    </tr>`;
  }
  function section(keys,label,cls,color){
    const rev=keys.reduce((s,k)=>s+DATA[k].revenue,0);
    const tgt=keys.reduce((s,k)=>s+DATA[k].target_h1,0);
    return`<tr class="mch-brand-hd ${cls}">
        <td colspan="8"><span style="color:${color}">${label}</span>
          <span style="font-size:10px;color:#888780;margin-left:8px">H1 ${fmtM(rev)} ／ 目標 ${fmtM(tgt)}</span></td>
      </tr>
      ${keys.map(storeRow).join('')}
      <tr class="mch-sub">
        <td>品牌小計</td>
        ${MOS.map((_,i)=>brandMoCell(keys,i)).join('')}
        ${brandTotCell(keys)}
      </tr>`;
  }
  return`<div class="mch-wrap">
    <div class="mch-scroll">
      <table class="mch-tbl">
        <thead><tr>
          <th>門市</th>${MOS.map(m=>`<th>${m}</th>`).join('')}<th>H1合計</th>
        </tr></thead>
        <tbody>
          ${section(KI_STORES,'原綺','ki','#c04070')}
          ${section(WO_STORES,'原渥','wo','#2d5a9e')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderAchMatrix(){
  const el=document.getElementById('tab5-body');
  if(!el) return;
  const curMo=new Date().getMonth()+1;
  const MOS=Array.from({length:curMo},(_,i)=>(i+1)+'月');
  const cols=MOS.length+1;
  function chip(p){
    if(p===null||p===undefined) return'<span class="mch mch-na">—</span>';
    return`<span class="mch ${p>=1?'mch-g':'mch-r'}">${Math.round(p*100)}%</span>`;
  }
  function moCell(key,i){
    const m=DATA[key].months&&DATA[key].months[i];
    // Fall back to MO_SNAP_DATA for months not yet in the main store sheet (e.g. current month)
    if(!m||m.rev===0){
      const snap=MO_SNAP_DATA[i]&&MO_SNAP_DATA[i][key];
      if(snap&&snap.total_rev>0){
        const tgt=snap.target||(DATA[key].monthly_tgt?DATA[key].monthly_tgt[i]:0)||(DATA[key].target_h1/6)||0;
        const ach=tgt>0?snap.total_rev/tgt:null;
        return`<td>${chip(ach)}<div class="mch-rev">${fmtM(snap.total_rev)}</div></td>`;
      }
      return`<td>${chip(null)}</td>`;
    }
    return`<td>${chip(m.achieve)}<div class="mch-rev">${fmtM(m.rev)}</div></td>`;
  }
  function storeRow(key){
    return`<tr><td>${DATA[key].label}</td>${MOS.map((_,i)=>moCell(key,i)).join('')}</tr>`;
  }
  el.innerHTML=`<div class="mch-wrap"><div class="mch-scroll">
    <table class="mch-tbl">
      <thead><tr><th>門市</th>${MOS.map(m=>`<th>${m}</th>`).join('')}</tr></thead>
      <tbody>
        <tr class="mch-brand-hd ki"><td colspan="${cols}"><span style="color:#c04070">原綺</span></td></tr>
        ${KI_STORES.map(storeRow).join('')}
        <tr class="mch-brand-hd wo"><td colspan="${cols}"><span style="color:#2d5a9e">原渥</span></td></tr>
        ${WO_STORES.map(storeRow).join('')}
      </tbody>
    </table>
  </div></div>`;
}

//  RENDER TAB 4: 每月業績狀況進度

function renderTab4(){
  const el=document.getElementById('tab4-body');
  if(!el) return;
  const MO_NAMES=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const loaded=MO_SNAP_DATA.map((d,i)=>d?i:-1).filter(i=>i>=0);
  if(!loaded.length){
    el.innerHTML='<div style="padding:40px;text-align:center;color:#888780">資料載入中…</div>';
    return;
  }
  if(!MO_SNAP_DATA[_curMoTab]) _curMoTab=loaded[loaded.length-1];
  const moData=MO_SNAP_DATA[_curMoTab]||{};

  // Month tabs row (loaded months + one greyed-out next month)
  const showUntil=Math.min(loaded[loaded.length-1]+2, MO_NAMES.length);
  const tabsHtml=MO_NAMES.slice(0,showUntil).map((n,i)=>{
    const avail=loaded.includes(i);
    const act=i===_curMoTab;
    return `<button class="mo-tab-btn${act?' active':''}${!avail?' dim':''}"${avail?` onclick="switchMoTab(${i})"`:''}>
      ${n}${!avail?'↗':''}
    </button>`;
  }).join('');

  // Brand totals
  function bTot(keys){
    let rev=0,tgt=0,nn=0,on=0,nr=0,or_=0;
    keys.forEach(k=>{const d=moData[k];if(!d)return;rev+=d.total_rev;tgt+=d.target;nn+=d.new_n;on+=d.old_n;nr+=d.new_rev;or_+=d.old_rev;});
    return{rev,tgt,new_n:nn,old_n:on,new_rev:nr,old_rev:or_,
      achieve:tgt>0?rev/tgt:null,
      new_avg:nn>0?Math.round(nr/nn):0,
      old_avg:on>0?Math.round(or_/on):0};
  }
  const kiKeys=KI_STORES.filter(k=>moData[k]);
  const woKeys=WO_STORES.filter(k=>moData[k]);
  const kiT=bTot(kiKeys), woT=bTot(woKeys);
  const tot_rev=kiT.rev+woT.rev, tot_tgt=kiT.tgt+woT.tgt;
  const tot_nn=kiT.new_n+woT.new_n, tot_on=kiT.old_n+woT.old_n;
  const tot_nr=kiT.new_rev+woT.new_rev, tot_or=kiT.old_rev+woT.old_rev;
  const tot_ach=tot_tgt>0?tot_rev/tot_tgt:null;
  const tot_na=tot_nn>0?Math.round(tot_nr/tot_nn):0;
  const tot_oa=tot_on>0?Math.round(tot_or/tot_on):0;

  function achCls(p){return p===null?'r':p>=1?'g':'r';}
  function achTxt(p){return p===null?'—':Math.round(p*100)+'%';}

  // Daily progress (only for current month tab)
  const _now=new Date();
  const _isCurMo=(_curMoTab===_now.getMonth());
  const _dayOfMo=Math.max(1,_now.getDate()-1);
  const _daysInMo=new Date(_now.getFullYear(),_curMoTab+1,0).getDate();
  const _dayRatio=_dayOfMo/_daysInMo;
  function dailyProg(rev,tgt){
    if(!tgt||!rev) return'';
    // 歷史月：顯示簡單達成率進度條
    if(!_isCurMo){
      const fillPct=Math.min(rev/tgt*100,100).toFixed(1);
      const color=rev>=tgt?'#3B6D11':rev/tgt>=0.8?'#b07d00':'#A32D2D';
      return`<div class="mo-prog-track" style="margin:4px 0 9px"><div class="mo-prog-fill" style="width:${fillPct}%;background:${color}"></div></div>`;
    }
    const exp=Math.round(tgt*_dayRatio);
    const gap=rev-exp;
    const isAhead=gap>=0;
    const bCls=isAhead?'ahead':'behind';
    const bTxt=isAhead?'超前':'落後';
    const fillPct=Math.min(rev/tgt*100,100).toFixed(1);
    const tickPct=Math.min(_dayRatio*100,100).toFixed(1);
    return`<div class="mo-day-prog">
      <div class="mo-day-row">
        <span class="mo-day-label">日進度 第${_dayOfMo}天 / 共${_daysInMo}天</span>
        <span class="mo-day-badge ${bCls}">${bTxt} ${fmtM(Math.abs(gap))}</span>
      </div>
      <div class="mo-day-nums">
        <span class="mo-day-cur">${fmtM(rev)}</span>
        <span class="mo-day-sep"> / </span>
        <span class="mo-day-exp">${fmtM(exp)}</span>
        <span class="mo-day-exp-lbl"> 應達</span>
      </div>
      <div class="mo-day-bar">
        <div class="mo-day-fill" style="width:${fillPct}%"></div>
        <div class="mo-day-tick" style="left:${tickPct}%"></div>
      </div>
      <div class="mo-day-bar-lbls"><span>0</span><span>月目標</span></div>
    </div>`;
  }

  // Brand card — tinted brand color bg, dark brand text
  function bCard(label,cls,color,t){
    const pct=t.achieve!==null?Math.min(t.achieve,1)*100:0;
    const revClr=cls==='ki'?'#5a0f2a':'#0d2247';

    const chipClr=achCls(t.achieve)==='g'?'#1a6b3c':'#c0392b';
    return`<div class="mo-bc ${cls}">
      <div class="mo-bc-top">
        <div class="mo-bc-brand">

          <span class="mo-bc-name" style="color:${labelClr}">${label}</span>

        <div class="mo-bc-2cell"><div class="mo-bc-2cell-v" style="color:${revClr}">${fmtN(t.old_n)}</div><div class="mo-bc-2cell-l" style="color:${labelClr}">舊客數</div></div>
        <div class="mo-bc-2cell"><div class="mo-bc-2cell-v" style="color:${revClr}">${fmtM(t.new_avg)}</div><div class="mo-bc-2cell-l" style="color:${labelClr}">新客客單</div></div>

  // Source table

  function srcTbl(d,brandKey){

      return`<tr>

        <td class="mo-src-bar-cell">
          <div class="mo-src-bar-wrap">
            <div class="mo-src-bar-new" style="width:${np}%;background:${nc}">${nv||''}</div>

    return`<div class="mo-src-divider"></div>

// Inject current-month new-client data from CONSULTANT_RECORDS into DATA[k].months
// so H2 months (idx>=6) with real data are not hidden by the isEmpty filter.
function injectCurrentMonthData(){
  const RECORD_TO_DATA = {
    'ki_dongmen':'ki_taipei', 'ki_taichung':'ki_taichung',
    'wo_zhanqian':'wo_zhanqian', 'wo_daan':'wo_daan',
    'wo_zhongxiao':'wo_zhongxiao', 'wo_dongmen':'wo_dongmen',
    'wo_taichung':'wo_taichung', 'wo_banqiao':'wo_banqiao',
  };
  if(typeof CONSULTANT_RECORDS==='undefined'||!CONSULTANT_RECORDS.length) return;
  // Find the latest month in CONSULTANT_RECORDS
  const allDates = CONSULTANT_RECORDS.map(r=>r.date||'').filter(Boolean).sort();
  const latestMonth = allDates[allDates.length-1].slice(0,7); // 'YYYY-MM'
  const moIdx = parseInt(latestMonth.slice(5,7)) - 1; // 0-based
  if(moIdx < 6) return; // only patch H2 months (July onward)
  const moLabel = (moIdx+1)+'月';

  // Aggregate new-client totals per DATA key for the latest month
  const totals = {};
  for(const r of CONSULTANT_RECORDS){
    if(!r.date || !r.date.startsWith(latestMonth)) continue;
    const dk = RECORD_TO_DATA[r.storeKey]; if(!dk) continue;
    if(!totals[dk]) totals[dk]={new_rev:0, new_n:0};
    for(const c of (r.clients||[])){
      if(c.type==='新客' && c.total_amt>0){
        totals[dk].new_rev += c.total_amt;
        totals[dk].new_n++;
      }
    }
  }

  // Patch DATA[k].months[moIdx]
  for(const [dk, t] of Object.entries(totals)){
    const d = DATA[dk]; if(!d) continue;
    // Pad months array if shorter than needed
    while(d.months.length <= moIdx){
      const padIdx = d.months.length;
      d.months.push({m:(padIdx+1)+'月', rev:0, new_rev:0, new_n:0, old_rev:0, old_n:0, achieve:null, tgt:null});
    }
    const mo = d.months[moIdx];
    // Only override if CONSULTANT_RECORDS has more data than what sync provided
    if(t.new_n > (mo.new_n||0)){
      // monthly_tgt (每月業績狀況進度目標) 優先於 store-sheet 同步的 mo.tgt
      const tgt = (d.monthly_tgt?d.monthly_tgt[moIdx]:null) || mo.tgt || null;
      mo.m = moLabel;
      mo.new_rev = t.new_rev;
      mo.new_n = t.new_n;
      mo.rev = t.new_rev + (mo.old_rev||0);
      mo.tgt = tgt;  // 同步更新 tgt，讓業績細項顯示正確目標
      mo.achieve = (tgt&&mo.rev>0) ? mo.rev/tgt : null;
    }
  }
}

function _fvs(v){
  if(!v) return'$0';
  if(v>=100000000) return'$'+(v/100000000).toFixed(2)+'億';
  if(v>=10000000) return'$'+(v/10000000).toFixed(2)+'千萬';
  if(v>=10000) return'$'+(v/10000).toFixed(0)+'萬';
  return'$'+Math.round(v).toLocaleString();
}

// Fallback queue: if gviz ignores responseHandler and calls the default handler instead
const _gvizPending=[];
(function(){
  const g=window.google=window.google||{};
  const v=g.visualization=g.visualization||{};
  const q=v.Query=v.Query||{};
  q.setResponse=function(d){

  };
})();

function loadGviz(sheetName, opts={}){
  return new Promise((resolve,reject)=>{
    const cb='_gviz_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    let done=false;
    function settle(fn,v){ if(!done){ done=true; clearTimeout(timer); cleanup(); fn(v); } }
    let timer=setTimeout(()=>{ settle(reject,new Error('timeout:'+sheetName)); },15000);
    function cleanup(){
      try{ delete window[cb]; s.remove(); }catch(e){}
      const i=_gvizPending.indexOf(resolver); if(i>=0) _gvizPending.splice(i,1);
    }
    const resolver=(d)=>settle(resolve,d);
    window[cb]=resolver;
    _gvizPending.push(resolver);
    const s=document.createElement('script');
    s.onerror=()=>settle(reject,new Error('script error:'+sheetName));
    const param=opts.gid?'gid='+opts.gid:'sheet='+encodeURIComponent(sheetName);
    s.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+
          '/gviz/tq?tqx=out:json;responseHandler:'+cb+'&'+param;
    document.head.appendChild(s);
  });
}

function cv(row,i){
  if(!row||!row.c||i>=row.c.length) return null;
  const c=row.c[i]; return c?c.v:null;
}
function toN(v){
  if(v===null||v===undefined) return 0;
  if(typeof v==='number') return v;
  const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}

function parseYearSheet(gd){
  const rows=gd.table.rows;
  const MAP={'原渥站前':'wo_zhanqian','原渥大安':'wo_daan','原渥忠孝':'wo_zhongxiao',
    '原渥板橋':'wo_banqiao','原渥東門':'wo_dongmen','原綺台北':'ki_taipei',
    '原渥台中':'wo_taichung','原綺台中':'ki_taichung'};
  const hist={}, tgt={};
  for(let ri=2;ri<rows.length;ri++){
    const r=rows[ri];
    const name=cv(r,0); if(!name||!MAP[name]) continue;
    const k=MAP[name], h=[];
    const r21=toN(cv(r,1)); if(r21) h.push({yr:2021,rev:r21});
    const r22=toN(cv(r,2)); if(r22) h.push({yr:2022,rev:r22});
    const r23=toN(cv(r,4)); if(r23) h.push({yr:2023,rev:r23});
    const r24=toN(cv(r,6)),t24=toN(cv(r,7));
    if(r24) h.push({yr:2024,rev:r24,...(t24?{target:t24}:{})});
    const r25=toN(cv(r,10)),t25=toN(cv(r,11));
    if(r25) h.push({yr:2025,rev:r25,...(t25?{target:t25}:{})});
    hist[k]=h;
    const t26=toN(cv(r,15)); if(t26) tgt[k]=t26;
  }
  return {hist,tgt};
}

function parseStoreSheet(gd,storeMap){
  // Sheet structure: section separator rows have c1="StoreName｜Year" (full-width pipe)
  // Metric rows follow: c1=總業績/新客業績/舊客業績/新客數/舊客數/目標, c2=YTD, cols 3-14=months 1-12
  const rows=gd.table.rows||[];
  const storeMetrics={};
  const storeMetrics25={};
  let curKey=null, curYear=null;

  for(const r of rows){
    const col1=cv(r,1), col1s=col1?String(col1).trim():'';
    // Section separator: sheet uses FULL-WIDTH pipe ｜ (U+FF5C); match both
    const sep=col1s.match(/^(.+)[|｜](\d{4})$/);
    if(sep){
      const storePart=sep[1].trim(), year=parseInt(sep[2]);
      curYear=year;
      if((year===2026||year===2025) && storeMap[storePart]){
        curKey=storeMap[storePart];
        if(year===2026 && !storeMetrics[curKey])   storeMetrics[curKey]={};
        if(year===2025 && !storeMetrics25[curKey]) storeMetrics25[curKey]={};
      } else { curKey=null; }
      continue;
    }
    if(!curKey) continue;
    const _m = curYear===2026 ? storeMetrics : curYear===2025 ? storeMetrics25 : null;
    if(!_m) continue;
    if(['總業績','新客業績','舊客業績','新客數','舊客數','目標'].includes(col1s)){
      _m[curKey][col1s]=r;
    }
  }

  const result={};
  for(const[key,m] of Object.entries(storeMetrics)){
    const revR=m['總業績']; if(!revR) continue;
    const totalRev=toN(cv(revR,2)); if(totalRev<=0) continue;
    const newRevR=m['新客業績'], oldRevR=m['舊客業績'];
    const newCntR=m['新客數'],   oldCntR=m['舊客數'];
    const newRev=toN(cv(newRevR,2)), oldRev=toN(cv(oldRevR,2));
    const newCnt=toN(cv(newCntR,2)), oldCnt=toN(cv(oldCntR,2));
    const tgtR=m['目標'];
    const months=[];
    for(let mo=0;mo<12;mo++){
      months.push({
        m:(mo+1)+'月',
        rev:    toN(cv(revR,   3+mo)),
        new_rev:toN(cv(newRevR,3+mo)),
        old_rev:toN(cv(oldRevR,3+mo)),
        new_n:  toN(cv(newCntR,3+mo)),
        old_n:  toN(cv(oldCntR,3+mo)),
        tgt:    tgtR?toN(cv(tgtR,3+mo)):null,
        achieve:null,
      });
    }
    // Fallback: estimate June from YTD if June=0 but YTD > sum(Jan-May)
    const sum15=months.slice(0,5).reduce((s,mo)=>s+mo.rev,0);
    if(months[5].rev===0 && totalRev>sum15) months[5].rev=totalRev-sum15;
    result[key]={totalRev,newRev,oldRev,totalCnt:newCnt+oldCnt,newCnt,oldCnt,months};
  }

  // Also parse 2025 monthly data → populate LY_MONTHLY (used for YoY per-cell display)
  for(const[key,m] of Object.entries(storeMetrics25)){
    const revR=m['總業績']; if(!revR) continue;
    const newRevR=m['新客業績'], oldRevR=m['舊客業績'];
    const newCntR=m['新客數'], oldCntR=m['舊客數'];
    const lyMonths=[];
    for(let mo=0;mo<12;mo++){
      lyMonths.push({
        rev:    toN(cv(revR,   3+mo)),
        new_rev:toN(cv(newRevR,3+mo)),
        old_rev:toN(cv(oldRevR,3+mo)),
        new_n:  toN(cv(newCntR,3+mo)),
        old_n:  toN(cv(oldCntR,3+mo)),
      });
    }
    LY_MONTHLY[key]=lyMonths;
  }

  return result;
}


function parseSrcSheet(gd){
  // Sheet gid=1673065208: monthly per-store new customer source breakdown
  // Col 1=store name, col 3="人數", col 7=行銷, col 8=業務, col 9=團購, col 10=其他
  // Brand context set by rows with col1="原綺" or "原渥"
  const rows=gd.table.rows||[];
  const result={};
  let brandCtx=null;
  // Read the month label from col headers
  const monthLabel=(gd.table.cols[4]||{}).label||'';
  for(const r of rows){
    const c1=String(cv(r,1)||'').trim();
    const c3=String(cv(r,3)||'').trim();
    if(c1==='原綺'){ brandCtx='ki'; continue; }
    if(c1==='原渥'){ brandCtx='wo'; continue; }
    if(!c1||c3!=='人數') continue;
    let key=null;
    if(c1==='台北') key='ki_taipei';
    else if(c1==='台中'&&brandCtx==='ki') key='ki_taichung';
    else if(c1==='站前') key='wo_zhanqian';
    else if(c1==='大安') key='wo_daan';
    else if(c1==='忠孝') key='wo_zhongxiao';
    else if(c1==='東門') key='wo_dongmen';
    else if(c1==='台中'&&brandCtx==='wo') key='wo_taichung';
    else if(c1==='板橋') key='wo_banqiao';
    if(key){
      result[key]={
        行銷:toN(cv(r,7))||0,
        業務:toN(cv(r,8))||0,
        團購:toN(cv(r,9))||0,
        其他:toN(cv(r,10))||0,
        _month:monthLabel,
      };
    }
  }
  return result;
}

async function loadData(){
  document.getElementById('sync-time').textContent='同步中…';
  // Render immediately with hardcoded data
  refreshAll();
  try{
    // Load month tabs for source breakdown + monthly performance (1月–current month)
    const _curMo=new Date().getMonth()+1;
    const _moNames=Array.from({length:_curMo},(_,i)=>(i+1)+'月');
    const [yrGd,kiGd,woGd,...srcGds]=await Promise.all([
      loadGviz('年度'),
      loadGviz('24-26原綺總業績'),
      loadGviz('24-26原渥總業績'),
      ..._moNames.map(n=>loadGviz(n).catch(()=>null)),
    ]);
    // Retry any failed month loads (concurrent requests can get dropped/timed-out)
    for(let i=0;i<srcGds.length;i++){
      if(!srcGds[i]){
        console.log('[retry] loading',_moNames[i]);
        await new Promise(r=>setTimeout(r,400));
        srcGds[i]=await loadGviz(_moNames[i]).catch(()=>null);
        if(srcGds[i]) console.log('[retry ok]',_moNames[i]);
        else console.warn('[retry failed]',_moNames[i]);
      }
    }
    // Update historical + 2026 full-year targets
    const {hist:nh,tgt:nt}=parseYearSheet(yrGd);
    Object.assign(HIST_DATA,nh);
    // Merge sheet targets but protect paired stores (shared targets in PAIRED_STORES take precedence)
    for(const[k,v] of Object.entries(nt)){
      if(!PAIRED_STORES[k]) TARGET_2026[k]=v;
    }
    // Update store data
    const WO_MAP={'站前':'wo_zhanqian','大安':'wo_daan','忠孝':'wo_zhongxiao','板橋':'wo_banqiao','東門':'wo_dongmen','台中':'wo_taichung'};
    const KI_MAP={'台北':'ki_taipei','台中':'ki_taichung'};
    const allStores={...parseStoreSheet(woGd,WO_MAP),...parseStoreSheet(kiGd,KI_MAP)};
    console.log('[sync] found stores:',Object.keys(allStores).join(','));
    const _kit=allStores.ki_taipei;
    if(_kit) console.log('[sync] ki_taipei jun rev:',_kit.months[5]?.rev,'YTD:',_kit.totalRev);
    else console.warn('[sync] ki_taipei NOT FOUND');
    for(const[k,ss]of Object.entries(allStores)){
      const d=DATA[k]; if(!d||ss.totalRev<=0) continue;
      d.revenue=ss.totalRev; d.new_rev=ss.newRev; d.old_rev=ss.oldRev;
      d.new_count=ss.newCnt; d.old_count=ss.oldCnt;
      d.new_avg=ss.newCnt>0?Math.round(ss.newRev/ss.newCnt):0;
      d.old_avg=ss.oldCnt>0?Math.round(ss.oldRev/ss.oldCnt):0;
      d.achieve_h1=d.target_h1>0?ss.totalRev/d.target_h1:0;
      // Monthly target priority: Sheet 目標 row → DATA.monthly_tgt → H1/6 fallback
      const fallbackMTgt=d.target_h1/6;
      d.months=ss.months.map((m,idx)=>{
        const tgt=m.tgt||(d.monthly_tgt&&d.monthly_tgt[idx])||fallbackMTgt;
        return {...m,achieve:m.rev>0&&tgt>0?m.rev/tgt:null,tgt:tgt||null};
      });
    }
    // Sum per-store new customer source breakdown across all loaded months
    const srcData={};
    for(const gd of srcGds){
      if(!gd) continue;
      const mo=parseSrcSheet(gd);
      for(const[k,src] of Object.entries(mo)){
        if(!srcData[k]) srcData[k]={行銷:0,業務:0,團購:0,其他:0,_label:'H1累計'};
        srcData[k].行銷+=src.行銷||0;
        srcData[k].業務+=src.業務||0;
        srcData[k].團購+=src.團購||0;
        srcData[k].其他+=src.其他||0;
      }
    }
    for(const[k,src] of Object.entries(srcData)){
      if(DATA[k]) DATA[k].new_src=src;
    }
    // Build per-month snapshot for monthly performance tab
    MO_SNAP_DATA=new Array(12).fill(null);
    for(let i=0;i<srcGds.length;i++){
      if(srcGds[i]) MO_SNAP_DATA[i]=parseMoSheet(srcGds[i]);
    }
    const lastLoaded=srcGds.filter(Boolean).length-1;
    if(lastLoaded>=0) _curMoTab=lastLoaded;
    const now=new Date();
    document.getElementById('sync-time').textContent=
      '已同步 '+now.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    refreshAll();
  }catch(err){
    console.error('Sheets sync failed:',err.message, err);
    document.getElementById('sync-time').textContent='離線模式（本地資料）';
  }
}

let _csMode = 'month'; // 'today' | 'yesterday' | 'month' | 'custom'
let _csClientFilter = 'all'; // 'all' | 'new' | 'ret'
let _csMonth = '';    // YYYY-MM，月份選擇器
let _csStart = '';
let _csEnd   = '';
let _csTrendOpen = false;
let _woTrendStore = '全部';
let _kiTrendStore = '全部';
let _woTrendChart = null;
let _kiTrendChart = null;

function renderConsultantTab(){
  const el = document.getElementById('consultant-tab-body');
  if(!el) return;
  if(_woTrendChart){_woTrendChart.destroy();_woTrendChart=null;}
  if(_kiTrendChart){_kiTrendChart.destroy();_kiTrendChart=null;}

  // 今日 / 昨日字串
  const now = new Date();
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayStr = fmt(now);
  const yest = new Date(now); yest.setDate(yest.getDate()-1);
  const yestStr = fmt(yest);

  // 月份選擇器預設為資料中最新的月份
  if(!_csMonth){
    const allDates = CONSULTANT_RECORDS.map(r=>r.date).sort();
    const latest = allDates[allDates.length-1] || todayStr;
    _csMonth = latest.slice(0,7);
  }
  const monthPrefix = _csMonth;

  // 自訂區間預設
  if(!_csStart) _csStart = `${_csMonth}-01`;
  if(!_csEnd)   _csEnd   = todayStr;

  const records = CONSULTANT_RECORDS.filter(r => {
    if(_csMode==='today')     return r.date === todayStr;
    if(_csMode==='yesterday') return r.date === yestStr;
    if(_csMode==='month')     return r.date.startsWith(monthPrefix);
    if(_csMode==='custom')    return r.date >= _csStart && r.date <= _csEnd;
    return false;
  });

  // 計算每筆 record 的統計
  // includeOther=true：'其他'(分享客)納入接待數，但不計入成交（用於門市/品牌/總計）
  // includeOther=false：只計新客，用於諮詢師個人統計
  // storeLevel=true  → 店總：未成交算 trial_amt；成交算 trial_amt + total_amt
  // storeLevel=false → 諮詢師：未成交不計；成交只算 total_amt
  function calcStats(recs, includeOther=false, storeLevel=false){
    let 接待=0, 成交=0, totalAmt=0;
    recs.forEach(r => {
      r.clients.forEach(c=>{
        if(c.type==='新客'){
          接待++;
          const converted = c.total_amt > 0; // 有課程金額即成交（含訂金）
          const pAmt = c.product_amt || 0;
          // 新客皆不計體驗價
          totalAmt += pAmt;
          if(converted) totalAmt += c.total_amt;
          if(converted) 成交++;
        } else if(c.type==='其他' && includeOther){
          接待++;
          // 分享客不計成交
          if(storeLevel) totalAmt += c.trial_amt + (c.product_amt||0);
        }
      });
    });
    const 成交率 = 接待>0 ? Math.round(成交/接待*100) : null;
    const 平均客單 = 接待>0 ? Math.round(totalAmt/接待) : null;
    return {接待, 成交, 未成交:接待-成交, 成交率, 平均客單};
  }

  function calcRetStats(recs){
    let totalOld=0,newTrial=0,purchased=0,revSum=0;
    recs.forEach(r=>{
      r.clients.forEach(c=>{
        if(c.type==='舊客'){if(!c.noCount)totalOld++;}
        else if(c.type==='舊客體驗'){
          totalOld++;newTrial++;
          revSum+=c.trial_amt; // 體驗金額計入（自有產品不計入舊客業績）
          if(c.total_amt>0){purchased++;revSum+=c.total_amt;} // 成交再加課程金額
        }
      });
    });
    const 開發率=totalOld>0?Math.round(newTrial/totalOld*100):null;
    const 成交率=newTrial>0?Math.round(purchased/newTrial*100):null;
    const 舊客客單=newTrial>0?Math.round(revSum/newTrial):null;
    return {totalOld,newTrial,purchased,未購買:newTrial-purchased,開發率,成交率,舊客客單,舊客業績:revSum};
  }

  function rateClr(r){ return r===null?'#aaa':r>=70?'#2a7a4a':r>=50?'#ba7517':'#a32d2d'; }
  function fmtAmt(v){ return v===null?'—':'$'+v.toLocaleString(); }
  function fmtRate(r){ return r===null?'—':r+'%'; }

  function chipsHtml(s){
    return `<div class="cs-chips">
      ${s.成交>0?`<span class="cs-chip cs-chip-ok">成交 ×${s.成交}</span>`:''}
      ${s.未成交>0?`<span class="cs-chip cs-chip-no">未成 ×${s.未成交}</span>`:''}
    </div>`;
  }

  // 品牌統計
  function brandBlock(brandKey, brandLabel){
    const br = records.filter(r=>r.brandKey===brandKey);
    const s = calcStats(br, true, true);
    const rs = calcRetStats(br);

    const nameCls = brandKey==='wo'?'wo':'ki';
    const stores = [...new Set(br.map(r=>r.storeKey))];
    return {s, rs, topCls, nameCls, stores, br, brandLabel};
  }
